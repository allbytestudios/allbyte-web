name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # Sync site build, but preserve game assets uploaded separately
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET }} \
            --delete \
            --exclude "assets/*" \
            --exclude "godot/*" \
            --exclude "test-snapshot/*" \
            --exclude "captures/*" \
            --exclude "savefixtures/*" \
            --exclude "Anthem2.mp3" \
            --exclude "cursor-move.wav" \
            --exclude "ChroniclesOfNesisTitle.gif" \
            --exclude "ChroniclesOfNesisTitle-still.png" \
            --exclude "ChroniclesOfNesisTitleName.png" \
            --exclude "BattleChargeRight.gif" \
            --exclude "BattleChargeRight-still.png" \
            --exclude "Flourish.png" \
            --exclude "leftSword.png" \
            --exclude "verticalSword.png" \
            --exclude "fonts/ModernGoth.otf"

          # Override cache headers for HTML files (must revalidate)
          aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }} s3://${{ secrets.AWS_S3_BUCKET }} \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html" \
            --metadata-directive REPLACE

          # Override cache headers for sw.js. Without an explicit
          # Cache-Control, CloudFront serves it with no header and
          # browsers fall back to heuristic freshness — meaning a stale
          # SW can persist on the client for hours after a deploy. The
          # SW spec mandates "no-cache" semantics: revalidate every fetch
          # but cache the bytes when ETag matches. This makes the
          # browser actually pick up the new SW on the next navigation
          # instead of holding the old one until the 24h cap.
          aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/sw.js s3://${{ secrets.AWS_S3_BUCKET }}/sw.js \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "application/javascript" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Verify deployment
        # One script, not sixty lines of inline bash. It replaced a step that
        # checked the homepage, /play/, HSTS and the /godot/ isolation headers —
        # all of that is still covered, plus the checks the old step could not
        # make: version coherence across committed/sw.js/deployed (the
        # stale-cache class of bug), robots.txt and the sitemap being REAL files
        # rather than the CDN's index.html fallback, and the search-visibility
        # rules actually having shipped.
        #
        # Deliberately shallow and fast: no browser, no game. Gameplay
        # assertions on every deploy went red for reasons unrelated to
        # deploying, and a check that is usually noise gets ignored.
        #
        # Writes a table to the run summary, so each deploy leaves a readable
        # record. Run the same checks locally any time: npm run verify:deploy
        run: |
          echo "Waiting for CloudFront invalidation to propagate..."
          sleep 15
          node scripts/verify-deploy.mjs --sha "${{ github.sha }}"

      - name: Notify subscribers of new content
        run: |
          NEW_POSTS=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- src/content/devlogs/ | grep '\.md$' || true)

          if [ -z "$NEW_POSTS" ]; then
            echo "No new devlog posts detected, skipping notifications."
            exit 0
          fi

          for POST_FILE in $NEW_POSTS; do
            if [ ! -f "$POST_FILE" ]; then
              echo "Skipping deleted file: $POST_FILE"
              continue
            fi

            TITLE=$(grep '^title:' "$POST_FILE" | sed 's/^title: *"\(.*\)"/\1/')
            DESC=$(grep '^description:' "$POST_FILE" | sed 's/^description: *"\(.*\)"/\1/')
            DEVLOG=$(grep '^devlog:' "$POST_FILE" | sed 's/^devlog: *"\(.*\)"/\1/')
            SLUG=$(basename "$POST_FILE" .md)

            echo "Notifying subscribers about: $TITLE (category: $DEVLOG)"

            aws lambda invoke \
              --function-name allbyte-studio-send-notification \
              --payload "$(jq -n --arg t "$TITLE" --arg d "$DESC" --arg c "$DEVLOG" --arg s "$SLUG" \
                '{category:$c,title:$t,description:$d,slug:$s,url:("https://allbyte.studio/devlog/"+$s+"/")}')" \
              --cli-binary-format raw-in-base64-out \
              /tmp/notify-response.json

            cat /tmp/notify-response.json
            echo ""
          done
