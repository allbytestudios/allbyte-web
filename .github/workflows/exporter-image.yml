name: Build exporter image

# Builds the Godot cloud-exporter image and pushes it to ECR via OIDC (no keys).
# Runs on manual dispatch, and automatically when the image inputs change — the
# deployer scripts baked into the image (push-channel.js / obfuscate-godot-export.js)
# and the Dockerfile — so CodeBuild's baked copies stay in sync with this repo.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - docker/exporter/**
      - scripts/push-channel.js
      - scripts/obfuscate-godot-export.js
      - src/lib/gameVersions.ts
      - .github/workflows/exporter-image.yml

concurrency:
  group: exporter-image
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: 408667082077.dkr.ecr.us-east-1.amazonaws.com/allbyte/godot-exporter
  GODOT_VERSION: 4.6.2-stable   # keep in step with Arc's container / the Dockerfile ARG

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::408667082077:role/allbyte-studio-github-exporter-image
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        # %%/* strips everything after the first slash → the bare registry host.
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${ECR_REPO%%/*}"

      - name: Compute image tag
        id: tag
        run: echo "tag=godot${GODOT_VERSION}-${GITHUB_SHA::7}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          docker build \
            --build-arg GODOT_VERSION="$GODOT_VERSION" \
            -f docker/exporter/Dockerfile \
            -t "$ECR_REPO:${{ steps.tag.outputs.tag }}" \
            .

      - name: Push
        run: docker push "$ECR_REPO:${{ steps.tag.outputs.tag }}"

      # Repoint every deployed allbyte-godot-* CodeBuild project at the image just
      # built, PRESERVING its environmentVariables (secret refs included). Closes
      # the "image rebuilt but the CodeBuild pin never advanced" gap that stranded
      # a fix for 4 days (2026-07-09). Safe to auto-advance because the boot smoke
      # baked into the image fails the CodeBuild run if a bad image is pinned.
      - name: Advance CodeBuild image pin(s)
        env:
          IMG: ${{ env.ECR_REPO }}:${{ steps.tag.outputs.tag }}
        run: |
          for project in allbyte-godot-develop; do
            if ! aws codebuild batch-get-projects --names "$project" \
                   --query 'projects[0].environment' --output json > /tmp/env.json 2>/dev/null \
               || [ "$(cat /tmp/env.json)" = "null" ]; then
              echo "::notice::project $project not found — skipping pin advance"
              continue
            fi
            jq --arg img "$IMG" '.image = $img' /tmp/env.json > /tmp/env.new.json
            aws codebuild update-project --name "$project" \
              --environment "file:///tmp/env.new.json" \
              --query 'project.environment.image' --output text
            echo "repointed $project -> $IMG"
          done

      - name: Summary
        run: |
          echo "### Exporter image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '`'"$ECR_REPO:${{ steps.tag.outputs.tag }}"'`' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Use this as the CodeBuild \`ExporterImageUri\` parameter." >> "$GITHUB_STEP_SUMMARY"
