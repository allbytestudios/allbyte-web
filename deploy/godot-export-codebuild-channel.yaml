AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Channel-parameterized cloud Godot web-export + deploy — ONE stack per channel,
  ONE shared buildspec (buildspec.web.yml), the channel selected by the DEBUG/ALPHA
  booleans this stack injects (owner's model, per CON_CLAUDE_CLOUD_DEPLOY_P2_P3_REPLY).
  Deploy with just Channel=<id>; the DEBUG/ALPHA env, S3 prefix, promote flag, and
  webhook trigger ref are all looked up from the ChannelMatrix mapping below.
  One project + one least-priv role PER channel (scoped to that channel's prefix) —
  so a single shared buildspec keeps per-channel blast-radius isolation. Role/
  Secrets-Manager creds only; no key/source in this template.

# Deploy per channel, e.g.:
#   aws cloudformation deploy --template-file deploy/godot-export-codebuild-channel.yaml \
#     --stack-name allbyte-studio-godot-beta-debug --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides Channel=beta-debug \
#       GitHubConnectionArn=... GameRepoId=... ExporterImageUri=... KeySecretArn=... \
#       SiteBucket=... DistributionId=... SecureTemplateBucket=...
# Deployable once Arc lands the shared buildspec.web.yml (DEBUG/ALPHA -> preset) on
# develop and confirms the hermetic release export. develop is branch-triggered;
# alpha/beta/beta-debug are TAG-triggered (release/<channel>/vX.Y.Z). alpha-debug
# (/godot/ root, legacy) is intentionally NOT a cloud channel here.

Parameters:
  Channel:
    Type: String
    AllowedValues: [develop, alpha, alpha-debug, beta, beta-debug]
    Description: >
      Build channel id. Everything else (S3 prefix, DEBUG/ALPHA env, promote flag,
      trigger ref) is derived from the ChannelMatrix mapping — matching Arc's
      export-preset 2x2. develop = the branch-triggered dev channel; the rest are
      tag-triggered.
  GitHubConnectionArn:
    Type: String
    Description: CodeConnections ARN authorizing read of the PRIVATE game repo (console OAuth).
  GameRepoId:
    Type: String
    Description: "owner/repo of the PRIVATE game source."
  SourceVersion:
    Type: String
    Default: develop
    Description: >
      Default source ref for manual builds (owner works off the develop branch;
      release builds are triggered by tags via the webhook filter, which overrides
      this per-trigger).
  ExporterImageUri:
    Type: String
    Description: ECR image URI of the exporter (auto-advanced by exporter-image.yml for allbyte-godot-*).
  KeySecretArn:
    Type: String
    Description: Secrets Manager ARN of the Godot script-encryption key (game/content key).
  SiteBucket:
    Type: String
    Description: S3 bucket that serves the site / game.
  DistributionId:
    Type: String
    Description: CloudFront distribution to invalidate.
  SecureTemplateBucket:
    Type: String
    Description: Private bucket holding the key-baked (SECRET) Godot web export template.
  EnableWebhook:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >
      Whether this project auto-triggers on its webhook (develop=branch push,
      alpha/beta=release tags). Deploy the BUTTON-driven channels (alpha, alpha-debug)
      with "false" so StartBuild from the demo-promote orchestrator is the ONLY path —
      no tag auto-promote to the public demo.

# The channel matrix — one row per cloud channel. Prefix = S3 segment under godot/
# (alpha ships to /godot/public/, not /godot/alpha/). Debug/Alpha = the two booleans
# the shared buildspec reads to pick the export preset. Promote = live channels
# (push-channel --promote: stamps sw.js + full smoke). TriggerRef = webhook HEAD_REF.
Mappings:
  ChannelMatrix:
    develop:    { Prefix: develop,    Debug: "true",  Alpha: "true",  Promote: "false", TriggerRef: "^refs/heads/develop$" }
    alpha:      { Prefix: public,     Debug: "false", Alpha: "true",  Promote: "true",  TriggerRef: "^refs/tags/release/alpha/.*$" }
    alpha-debug: { Prefix: alpha-debug, Debug: "true", Alpha: "true", Promote: "false", TriggerRef: "^refs/tags/never/.*$" }
    beta:       { Prefix: beta,       Debug: "false", Alpha: "false", Promote: "true",  TriggerRef: "^refs/tags/release/beta/.*$" }
    beta-debug: { Prefix: beta-debug, Debug: "true",  Alpha: "false", Promote: "false", TriggerRef: "^refs/tags/release/beta-debug/.*$" }

Conditions:
  # Live/player-facing channels: push-channel --promote also stamps sw.js at the
  # site root (stale-cache guard), so their role needs that one extra write.
  IsPromote: !Equals [!FindInMap [ChannelMatrix, !Ref Channel, Promote], "true"]
  WebhookOn: !Equals [!Ref EnableWebhook, "true"]

Resources:
  # --- least-privilege build role: can ONLY ship this channel's prefix ---------
  ExportBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "allbyte-studio-godot-${Channel}-export"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "deploy-${Channel}-only"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # write ONLY this channel's prefix + the shared channels.json.
              - Sid: WriteChannelObjects
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource:
                  - !Sub
                    - "arn:aws:s3:::${SiteBucket}/godot/${Prefix}/*"
                    - Prefix: !FindInMap [ChannelMatrix, !Ref Channel, Prefix]
                  - !Sub "arn:aws:s3:::${SiteBucket}/godot/channels.json"
              # live channels only: stamp sw.js at the site root (stale-cache guard).
              - !If
                - IsPromote
                - Sid: StampServiceWorker
                  Effect: Allow
                  Action: s3:PutObject
                  Resource: !Sub "arn:aws:s3:::${SiteBucket}/sw.js"
                - !Ref "AWS::NoValue"
              - Sid: ListChannelPrefix
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${SiteBucket}"
                Condition:
                  StringLike:
                    "s3:prefix":
                      - !Sub
                        - "godot/${Prefix}/*"
                        - Prefix: !FindInMap [ChannelMatrix, !Ref Channel, Prefix]
                      - "godot/channels.json"
              - Sid: InvalidateOneDistribution
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"
              - Sid: ReadKeySecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref KeySecretArn
              - Sid: ReadSecureTemplate
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SecureTemplateBucket}/godot-templates/*"
              - Sid: UseSourceConnection
                Effect: Allow
                Action:
                  - codeconnections:UseConnection
                  - codeconnections:GetConnection
                  - codeconnections:GetConnectionToken
                  - codestar-connections:UseConnection
                  - codestar-connections:GetConnection
                  - codestar-connections:GetConnectionToken
                Resource: !Ref GitHubConnectionArn
              - Sid: PullExporterImage
                Effect: Allow
                Action: [ecr:GetDownloadUrlForLayer, ecr:BatchGetImage, ecr:BatchCheckLayerAvailability]
                Resource: !Sub "arn:aws:ecr:us-east-1:${AWS::AccountId}:repository/allbyte/godot-exporter"
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/allbyte-godot-${Channel}:*"

  ExportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/allbyte-godot-${Channel}"
      RetentionInDays: 30

  BuildFailureMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ExportLogGroup
      FilterPattern: '{ $.ok IS FALSE }'
      MetricTransformations:
        - MetricNamespace: AllByte/GodotExport
          MetricName: !Sub "${Channel}-build-failure"
          MetricValue: "1"
          DefaultValue: 0

  BuildFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "allbyte-godot-${Channel}-build-failure"
      AlarmDescription: !Sub "A cloud ${Channel} export/deploy emitted ok:false (see CodeBuild logs)."
      Namespace: AllByte/GodotExport
      MetricName: !Sub "${Channel}-build-failure"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ExportProject:
    Type: AWS::CodeBuild::Project
    DependsOn: ExportLogGroup
    Properties:
      Name: !Sub "allbyte-godot-${Channel}"
      Description: !Sub "Headless Godot web export + push-channel deploy for the ${Channel} channel."
      ServiceRole: !GetAtt ExportBuildRole.Arn
      TimeoutInMinutes: 30
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: !Ref ExporterImageUri
        ImagePullCredentialsType: SERVICE_ROLE
        EnvironmentVariables:
          - { Name: SITE_BUCKET, Value: !Ref SiteBucket }
          - { Name: DISTRIBUTION_ID, Value: !Ref DistributionId }
          # Deploy channel id (matches gameVersions.ts / push-channel --channel):
          # push-channel resolves the S3 prefix from it (alpha -> public,
          # alpha-debug -> alpha-debug). cloud_export derives the PRESET from DEBUG/ALPHA.
          - { Name: CHANNEL, Value: !Ref Channel }
          # Boot gate: cloud_export runs boot_check.py behind this → a release
          # artifact that doesn't reach gameState.ready FAILS the build (never ships).
          - { Name: BOOT_SMOKE, Value: "1" }
          # The two booleans the shared buildspec reads to pick the export preset
          # (DEBUG/ALPHA -> Web {Alpha|Beta} {Debug|Public}). push-channel derives
          # --promote from the channel (DEBUG=false = live). Fixed per project, so
          # one project = one channel = one least-priv role (no tag-keyed scoping).
          - { Name: DEBUG, Value: !FindInMap [ChannelMatrix, !Ref Channel, Debug] }
          - { Name: ALPHA, Value: !FindInMap [ChannelMatrix, !Ref Channel, Alpha] }
          - { Name: GODOT_SCRIPT_ENCRYPTION_KEY, Type: SECRETS_MANAGER, Value: !Ref KeySecretArn }
          - { Name: GODOT_RELEASE_SCRIPT_KEY, Type: SECRETS_MANAGER, Value: !Ref KeySecretArn }
      Source:
        Type: GITHUB
        Location: !Sub "https://github.com/${GameRepoId}.git"
        Auth: { Type: CODECONNECTIONS, Resource: !Ref GitHubConnectionArn }
        # ONE shared buildspec for every channel — it reads DEBUG/ALPHA to select
        # the preset and adds --promote for live channels (Arc owns it in the game repo).
        BuildSpec: buildspec.web.yml
      SourceVersion: !Ref SourceVersion
      # Webhook only for auto-triggered channels (develop=branch, beta=tags).
      # Button-driven channels (alpha, alpha-debug) deploy with EnableWebhook=false
      # → no Triggers → StartBuild (the demo-promote orchestrator) is the sole path.
      Triggers: !If
        - WebhookOn
        - Webhook: true
          FilterGroups:
            - - { Type: EVENT, Pattern: PUSH }
              - Type: HEAD_REF
                Pattern: !FindInMap [ChannelMatrix, !Ref Channel, TriggerRef]
        - !Ref "AWS::NoValue"
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref ExportLogGroup

Outputs:
  ProjectName: { Value: !Ref ExportProject }
  BuildRoleArn: { Value: !GetAtt ExportBuildRole.Arn }
  Prefix: { Value: !FindInMap [ChannelMatrix, !Ref Channel, Prefix] }
  Promote: { Value: !FindInMap [ChannelMatrix, !Ref Channel, Promote] }
  TriggerRef: { Value: !FindInMap [ChannelMatrix, !Ref Channel, TriggerRef] }
