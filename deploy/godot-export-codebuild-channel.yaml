AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Channel-parameterized cloud Godot web-export + deploy — one stack PER build
  channel. A push to the game repo's BuildBranch triggers CodeBuild, which exports
  headless inside the pinned exporter image then runs scripts/push-channel.js to
  obfuscate + boot-smoke + deploy to s3://<SiteBucket>/godot/<Channel>/ and publish
  channels.json. Role/Secrets-Manager creds only; no key/source in this template.
  Generalized from deploy/godot-export-codebuild.yaml (the develop stack). SCAFFOLD
  for P2 — see APP_CLAUDE_CLOUD_DEPLOY_P2_P3.md and the deploy example below.

# Deploy a NEW stack per channel, e.g. beta-debug:
#   aws cloudformation deploy --template-file deploy/godot-export-codebuild-channel.yaml \
#     --stack-name allbyte-studio-godot-beta-debug --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides Channel=beta-debug BuildBranch=<branch> \
#       GitHubConnectionArn=... GameRepoId=... ExporterImageUri=... KeySecretArn=... \
#       SiteBucket=... DistributionId=... SecureTemplateBucket=...
# Deployable once (a) ExporterImageUri exists in ECR, (b) Arc lands
# buildspec.<Channel>.yml on the trigger branch, (c) the export is hermetic.
# The develop stack can migrate to this later (Channel=develop) — resource names
# match except the CloudWatch metric name (cosmetic recreate).

Parameters:
  Channel:
    Type: String
    AllowedValues: [develop, beta-debug, alpha-debug, alpha, beta]
    Description: >
      Build channel id (from gameVersions.ts). Drives the S3 prefix
      (godot/<Channel>/), the buildspec name (buildspec.<Channel>.yml), and all
      resource names. Live channels (alpha/alpha-debug/beta) additionally require
      push-channel's --promote in their buildspec — this template only scopes the
      infra; it does not itself gate live vs dev.
  GitHubConnectionArn:
    Type: String
    Description: >
      CodeConnections (CodeStar) connection ARN authorizing read of the PRIVATE
      game repo. Created once via console OAuth — never a pasted token.
  GameRepoId:
    Type: String
    Description: "owner/repo of the PRIVATE game source (e.g. AllByte/ChroniclesOfNesis)."
  BuildBranch:
    Type: String
    Default: develop
    Description: Branch whose pushes trigger a build+deploy for this channel.
  ExporterImageUri:
    Type: String
    Description: >
      ECR image URI (pinned by tag) of the exporter: Godot headless + web export
      templates + node + the boot-smoke browser. Built from a REVIEWED commit of
      the public exporter repo. Auto-advanced by .github/workflows/exporter-image.yml
      after each image build (this project matches allbyte-godot-*).
  KeySecretArn:
    Type: String
    Description: >
      Secrets Manager ARN of the Godot script-encryption key (game/content key).
      Value provisioned out-of-band by the owner/Arc; never in this template.
  SiteBucket:
    Type: String
    Description: S3 bucket that serves the site / game (pass on deploy).
  DistributionId:
    Type: String
    Description: CloudFront distribution to invalidate (pass on deploy).
  SecureTemplateBucket:
    Type: String
    Description: >
      Private bucket holding the key-baked (SECRET) Godot web export template.
      The build installs it over the stock template so encrypted PCKs decrypt at
      runtime. Same trust tier as the Secrets Manager key — never public.

Resources:
  # --- least-privilege build role: can ONLY ship this channel's path ----------
  ExportBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "allbyte-studio-godot-${Channel}-export"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "deploy-${Channel}-only"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # write ONLY this channel's prefix + the shared channels.json.
              # Cannot touch any other channel, the site, or anything else.
              - Sid: WriteChannelObjects
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource:
                  - !Sub "arn:aws:s3:::${SiteBucket}/godot/${Channel}/*"
                  - !Sub "arn:aws:s3:::${SiteBucket}/godot/channels.json"
              # aws s3 sync needs ListBucket, scoped to this channel's prefix.
              - Sid: ListChannelPrefix
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${SiteBucket}"
                Condition:
                  StringLike:
                    "s3:prefix": [!Sub "godot/${Channel}/*", "godot/channels.json"]
              - Sid: InvalidateOneDistribution
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"
              # read ONLY the one key secret (also injected as masked env below).
              - Sid: ReadKeySecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref KeySecretArn
              # the key-baked web export template (secret) — installed before export
              - Sid: ReadSecureTemplate
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SecureTemplateBucket}/godot-templates/*"
              - Sid: UseSourceConnection
                Effect: Allow
                Action:
                  - codeconnections:UseConnection
                  - codeconnections:GetConnection
                  - codeconnections:GetConnectionToken
                  - codestar-connections:UseConnection
                  - codestar-connections:GetConnection
                  - codestar-connections:GetConnectionToken
                Resource: !Ref GitHubConnectionArn
              - Sid: PullExporterImage
                Effect: Allow
                Action: [ecr:GetDownloadUrlForLayer, ecr:BatchGetImage, ecr:BatchCheckLayerAvailability]
                Resource: !Sub "arn:aws:ecr:us-east-1:${AWS::AccountId}:repository/allbyte/godot-exporter"
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/allbyte-godot-${Channel}:*"

  # Declared (not auto-created) so retention is set and the metric filter attaches.
  ExportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/allbyte-godot-${Channel}"
      RetentionInDays: 30

  # Turns push-channel's final structured log line
  # {stage, ok, duration_s, bytes, version, git_sha, channel} into an alarmable
  # metric — a failed cloud export/deploy for this channel.
  BuildFailureMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ExportLogGroup
      FilterPattern: '{ $.ok IS FALSE }'
      MetricTransformations:
        - MetricNamespace: AllByte/GodotExport
          MetricName: !Sub "${Channel}-build-failure"
          MetricValue: "1"
          DefaultValue: 0

  BuildFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "allbyte-godot-${Channel}-build-failure"
      AlarmDescription: !Sub "A cloud ${Channel} export/deploy emitted ok:false (see CodeBuild logs)."
      Namespace: AllByte/GodotExport
      MetricName: !Sub "${Channel}-build-failure"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ExportProject:
    Type: AWS::CodeBuild::Project
    DependsOn: ExportLogGroup
    Properties:
      Name: !Sub "allbyte-godot-${Channel}"
      Description: !Sub "Headless Godot web export + push-channel deploy for the ${Channel} channel."
      ServiceRole: !GetAtt ExportBuildRole.Arn
      TimeoutInMinutes: 30
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: !Ref ExporterImageUri
        ImagePullCredentialsType: SERVICE_ROLE
        EnvironmentVariables:
          - { Name: SITE_BUCKET, Value: !Ref SiteBucket }
          # push-channel reads DISTRIBUTION_ID to invalidate CloudFront in-role
          # (the least-priv role can't DescribeStacks). See push-channel.js.
          - { Name: DISTRIBUTION_ID, Value: !Ref DistributionId }
          # Same key, TWO names (both MASKED): Godot's export step reads
          # GODOT_SCRIPT_ENCRYPTION_KEY; our obfuscator reads GODOT_RELEASE_SCRIPT_KEY.
          # The secret must be a PLAIN string (64-hex), not JSON.
          - { Name: GODOT_SCRIPT_ENCRYPTION_KEY, Type: SECRETS_MANAGER, Value: !Ref KeySecretArn }
          - { Name: GODOT_RELEASE_SCRIPT_KEY, Type: SECRETS_MANAGER, Value: !Ref KeySecretArn }
      Source:
        Type: GITHUB
        Location: !Sub "https://github.com/${GameRepoId}.git"
        Auth: { Type: CODECONNECTIONS, Resource: !Ref GitHubConnectionArn }
        # buildspec lives in the PRIVATE game repo (Arc owns the export command).
        BuildSpec: !Sub "buildspec.${Channel}.yml"
      SourceVersion: !Ref BuildBranch
      Triggers:
        Webhook: true
        FilterGroups:
          - - { Type: EVENT, Pattern: PUSH }
            - { Type: HEAD_REF, Pattern: !Sub "^refs/heads/${BuildBranch}$" }
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref ExportLogGroup

Outputs:
  ProjectName: { Value: !Ref ExportProject }
  BuildRoleArn: { Value: !GetAtt ExportBuildRole.Arn }
