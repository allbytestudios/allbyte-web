# Postiz self-hosted marketing automation
#
# AppC-managed marketing container, isolated from Arc's tactical-dev game-dev
# container. Hosts Postiz (open-source social scheduler with MCP server) +
# its PostgreSQL + Redis dependencies.
#
# Bring up:    docker compose -f infrastructure/marketing/docker-compose.yml up -d
# Bring down:  docker compose -f infrastructure/marketing/docker-compose.yml down
# Logs:        docker compose -f infrastructure/marketing/docker-compose.yml logs -f postiz
# Reset state: docker compose -f infrastructure/marketing/docker-compose.yml down -v
#
# Postiz UI:   http://localhost:5000 (default after first run)
# Postiz API:  http://localhost:3000 (internal, MCP server uses this too)
#
# Before first run: copy .env.example to .env and set JWT_SECRET (any
# strong random string). See README.md for the full setup walkthrough
# including the social platform OAuth callback URL story for actual
# publishing.

name: allbyte-marketing

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: allbyte-marketing-postiz
    restart: unless-stopped
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      postiz-temporal:
        condition: service_started
    environment:
      # Temporal — Postiz uses it for scheduled job workflows. Address
      # is the internal docker network hostname + Temporal's gRPC port.
      TEMPORAL_ADDRESS: "postiz-temporal:7233"
      # URLs — for purely local testing these point at localhost. When
      # connecting real social-platform OAuth (Bluesky/Mastodon don't
      # need it; Reddit/X do), set MAIN_URL + FRONTEND_URL to a publicly
      # reachable URL (Tailscale Funnel works) and update the OAuth app
      # callback URLs at each platform to match.
      MAIN_URL: "${MAIN_URL:-http://localhost:5000}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5000}"
      NEXT_PUBLIC_BACKEND_URL: "${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3000}"
      BACKEND_INTERNAL_URL: "http://localhost:3000"

      JWT_SECRET: "${JWT_SECRET:?must be set in .env — generate via openssl rand -hex 32}"

      # Database
      DATABASE_URL: "postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-local"

      # Redis
      REDIS_URL: "redis://postiz-redis:6379"

      # Storage
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"

      # MCP server — exposed for Claude/Claude Code to drive Postiz.
      # Postiz reads this at startup to determine whether to bind the
      # MCP endpoint.
      MCP_ENABLED: "true"

      # Misc
      IS_GENERAL: "true"
    ports:
      - "${POSTIZ_FRONTEND_PORT:-5000}:5000"
      - "${POSTIZ_BACKEND_PORT:-3000}:3000"
    volumes:
      - postiz_uploads:/uploads
      - postiz_config:/config

  postiz-postgres:
    image: postgres:17-alpine
    container_name: allbyte-marketing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postiz-user
      POSTGRES_PASSWORD: postiz-password
      POSTGRES_DB: postiz-db-local
    volumes:
      - postiz_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz-user -d postiz-db-local"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed to host — only postiz container needs to reach it.

  postiz-redis:
    image: redis:7.2-alpine
    container_name: allbyte-marketing-redis
    restart: unless-stopped
    volumes:
      - postiz_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed to host — only postiz container needs to reach it.

  # Temporal — workflow scheduler used by Postiz for scheduled posts.
  # auto-setup image bundles the Temporal server + auto-creates required
  # namespaces against the provided Postgres. Uses a separate Postgres
  # instance from Postiz's own DB so the two concerns don't share state.
  #
  # Versions and Elasticsearch search-attribute store mirror Postiz's
  # upstream compose at https://github.com/gitroomhq/postiz-app/blob/main/docker-compose.yaml
  # — Postgres-only search store hits the 3-Text-attribute limit when
  # Postiz tries to register its full search-attribute set on boot.
  # ES lifts that limit. Lesson learned 2026-06-04 — Postiz crashed with
  # "cannot have more than 3 search attribute of type Text" until ES was
  # wired in.
  postiz-temporal-postgres:
    image: postgres:16-alpine
    container_name: allbyte-marketing-temporal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - postiz_temporal_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  postiz-temporal-elasticsearch:
    image: elasticsearch:7.17.27
    container_name: allbyte-marketing-temporal-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - postiz_temporal_elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postiz-temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: allbyte-marketing-temporal
    restart: unless-stopped
    depends_on:
      postiz-temporal-postgres:
        condition: service_healthy
      postiz-temporal-elasticsearch:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postiz-temporal-postgres
      ENABLE_ES: "true"
      ES_SEEDS: postiz-temporal-elasticsearch
      ES_VERSION: v7
    # Not exposed to host — postiz container talks to it via the
    # internal docker network.

volumes:
  postiz_uploads:
  postiz_config:
  postiz_postgres:
  postiz_redis:
  postiz_temporal_postgres:
  postiz_temporal_elasticsearch:
