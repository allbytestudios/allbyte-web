AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Server-side pack gating (v1). An HTTP API that hands out short-lived presigned
  S3 GET URLs for zone .pck files in the PRIVATE allbyte-studio-packs bucket, so
  the pack bytes never reach an unauthenticated client. Matches PackLoader.gd's
  contract: GET /pack?pack=<Name> with a Bearer JWT -> {"url": <presigned>}.
  GET /pack-token issues an anonymous short-lived JWT (anti-scrape baseline).
  Uses the same HS256 secret as the rest of auth, so logged-in tokens work too.

Parameters:
  PackBucket:
    Type: String
    Default: allbyte-studio-packs
    Description: Private bucket holding the gated zone packs (packs/<Name>.pck).
  PackPrefix:
    Type: String
    Default: "packs/"
  JwtSecretArn:
    Type: String
    Default: "arn:aws:secretsmanager:us-east-1:408667082077:secret:allbyte-studio/jwt-secret-t5EawG"
  JwtSecretId:
    Type: String
    Default: "allbyte-studio/jwt-secret"
  AllowOrigin:
    Type: String
    Default: "https://allbyte.studio"
  PresignTtl:
    Type: Number
    Default: 900
  AnonTtl:
    Type: Number
    Default: 3600
  AllowedPacks:
    Type: String
    Default: ""
    Description: Optional comma list of allowed pack names; empty = any safe name.

Resources:
  PackAuthRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: allbyte-studio-pack-gating
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pack-gating
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadGatedPacks
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${PackBucket}/${PackPrefix}*"
              - Sid: ReadJwtSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref JwtSecretArn
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: "*"

  PackAuthFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: allbyte-studio-pack-auth
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt PackAuthRole.Arn
      Environment:
        Variables:
          PACK_BUCKET: !Ref PackBucket
          PACK_PREFIX: !Ref PackPrefix
          JWT_SECRET_ID: !Ref JwtSecretId
          ALLOW_ORIGIN: !Ref AllowOrigin
          PRESIGN_TTL: !Ref PresignTtl
          ANON_TTL: !Ref AnonTtl
          ALLOWED_PACKS: !Ref AllowedPacks
      Code:
        ZipFile: |
          import json, time, os, hmac, hashlib, base64, re, secrets as pysecrets
          import boto3

          sm = boto3.client("secretsmanager")
          s3 = boto3.client("s3", region_name="us-east-1")
          _cache = {}
          PACK_BUCKET = os.environ["PACK_BUCKET"]
          PACK_PREFIX = os.environ.get("PACK_PREFIX", "packs/")
          TTL = int(os.environ.get("PRESIGN_TTL", "900"))
          ANON_TTL = int(os.environ.get("ANON_TTL", "3600"))
          ALLOW_ORIGIN = os.environ.get("ALLOW_ORIGIN", "https://allbyte.studio")
          _allowed = os.environ.get("ALLOWED_PACKS") or ""
          ALLOWED = set(x.strip() for x in _allowed.split(",") if x.strip()) or None
          PACK_RE = re.compile(r"^[A-Za-z0-9_-]+$")

          def get_secret():
              if "jwt" not in _cache:
                  _cache["jwt"] = sm.get_secret_value(SecretId=os.environ["JWT_SECRET_ID"])["SecretString"]
              return _cache["jwt"]

          def verify_jwt(token, secret):
              parts = token.split(".")
              if len(parts) != 3:
                  return None
              sig_input = f"{parts[0]}.{parts[1]}"
              expected = base64.urlsafe_b64encode(
                  hmac.new(secret.encode(), sig_input.encode(), hashlib.sha256).digest()
              ).rstrip(b"=").decode()
              if not hmac.compare_digest(parts[2], expected):
                  return None
              pb = parts[1] + "=" * (4 - len(parts[1]) % 4)
              try:
                  payload = json.loads(base64.urlsafe_b64decode(pb))
              except Exception:
                  return None
              if payload.get("exp", 0) < time.time():
                  return None
              return payload

          def sign_jwt(payload, secret):
              header = base64.urlsafe_b64encode(json.dumps({"alg": "HS256", "typ": "JWT"}).encode()).rstrip(b"=").decode()
              body = base64.urlsafe_b64encode(json.dumps(payload).encode()).rstrip(b"=").decode()
              sig_input = f"{header}.{body}"
              sig = base64.urlsafe_b64encode(
                  hmac.new(secret.encode(), sig_input.encode(), hashlib.sha256).digest()
              ).rstrip(b"=").decode()
              return f"{header}.{body}.{sig}"

          def resp(code, body):
              return {
                  "statusCode": code,
                  "headers": {
                      "Content-Type": "application/json",
                      "Access-Control-Allow-Origin": ALLOW_ORIGIN,
                      "Access-Control-Allow-Headers": "Authorization,Content-Type",
                      "Access-Control-Allow-Methods": "GET,OPTIONS",
                      "Cache-Control": "no-store",
                  },
                  "body": json.dumps(body),
              }

          def handler(event, ctx):
              http = event.get("requestContext", {}).get("http", {})
              method = http.get("method", "GET")
              path = http.get("path", "") or ""
              if method == "OPTIONS":
                  return resp(204, {})
              if path.endswith("/pack-token"):
                  now = int(time.time())
                  tok = sign_jwt({"sub": "anon:" + pysecrets.token_hex(8), "anon": True, "iat": now, "exp": now + ANON_TTL}, get_secret())
                  return resp(200, {"token": tok})
              if path.endswith("/pack"):
                  headers = {k.lower(): v for k, v in (event.get("headers") or {}).items()}
                  auth = headers.get("authorization", "")
                  if not auth.lower().startswith("bearer "):
                      return resp(401, {"error": "missing bearer token"})
                  if not verify_jwt(auth[7:].strip(), get_secret()):
                      return resp(401, {"error": "invalid or expired token"})
                  params = event.get("queryStringParameters") or {}
                  pack = (params.get("pack") or "").strip()
                  if not pack or not PACK_RE.match(pack):
                      return resp(400, {"error": "bad pack name"})
                  if ALLOWED is not None and pack not in ALLOWED:
                      return resp(404, {"error": "unknown pack"})
                  key = PACK_PREFIX + pack + ".pck"
                  try:
                      s3.head_object(Bucket=PACK_BUCKET, Key=key)
                  except Exception:
                      return resp(404, {"error": "pack not found"})
                  url = s3.generate_presigned_url("get_object", Params={"Bucket": PACK_BUCKET, "Key": key}, ExpiresIn=TTL)
                  return resp(200, {"url": url})
              return resp(404, {"error": "not found"})

  PackApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: allbyte-studio-pack-gating
      ProtocolType: HTTP

  PackIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PackApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt PackAuthFunction.Arn
      PayloadFormatVersion: "2.0"

  PackRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PackApi
      RouteKey: "$default"
      Target: !Sub "integrations/${PackIntegration}"

  PackStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref PackApi
      StageName: "$default"
      AutoDeploy: true

  PackInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PackAuthFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PackApi}/*"

Outputs:
  PackAuthEndpoint:
    Description: Base URL — PACK_AUTH_ENDPOINT is <this>/pack; token at <this>/pack-token
    Value: !GetAtt PackApi.ApiEndpoint
