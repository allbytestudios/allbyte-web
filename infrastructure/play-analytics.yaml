AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Anonymous play-depth funnel for allbyte.studio. Standalone (NOT part of the
  Stripe/Patreon stack, which is mid-migration) so it can be deployed/iterated in
  isolation. Captures scene-progression beacons from /play/ and exposes an
  admin-gated aggregate funnel. No PII: a session-scoped random id, the scene
  names reached, time played, and the referrer HOST only (e.g. "reddit.com").

Parameters:
  SiteDomain:
    Type: String
    Default: https://allbyte.studio
    Description: Allowed CORS origin for the write/read Function URLs.
  UsersTable:
    Type: String
    Default: allbyte-studio-users
    Description: >
      DynamoDB users table (from the backend stack). The read endpoint's PRIMARY
      admin gate is tier == "admin" on the caller's record here, so any admin
      works automatically — no per-email config, single source of truth, matches
      the rest of the app's admin model.
  AdminEmails:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      OPTIONAL comma-separated email allowlist — a fallback gate used only if the
      tier lookup is unavailable or mid-migration. Leave empty in normal
      operation; the UsersTable tier check is what authorizes admins.
  RetentionDays:
    Type: String
    Default: "90"
    Description: Rows auto-expire via DynamoDB TTL after this many days (string so it's a valid Lambda env var value).

Resources:
  PlayFunnelTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: allbyte-studio-play-funnel
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # --- Write (public beacon) ----------------------------------------------
  WriteRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: write-funnel
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt PlayFunnelTable.Arn

  WriteFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: allbyte-studio-play-funnel-write
      Runtime: python3.12
      Handler: index.handler
      Timeout: 5
      MemorySize: 128
      Role: !GetAtt WriteRole.Arn
      Environment:
        Variables:
          TABLE: !Ref PlayFunnelTable
          SITE_DOMAIN: !Ref SiteDomain
          RETENTION_DAYS: !Ref RetentionDays
      Code:
        ZipFile: |
          import json, os, re, time, boto3

          table = boto3.resource("dynamodb").Table(os.environ["TABLE"])
          RETENTION = int(os.environ.get("RETENTION_DAYS", "90"))
          SAFE = re.compile(r"[^A-Za-z0-9_./:\- ]")
          EVENTS = {"open", "scene", "end"}

          def clean(s, n):
              if not isinstance(s, str):
                  return ""
              return SAFE.sub("", s)[:n]

          def resp(code):
              # CORS is applied by the Function URL config; body kept tiny.
              return {"statusCode": code}

          def handler(event, context):
              method = event.get("requestContext", {}).get("http", {}).get("method", "")
              if method == "OPTIONS":
                  return resp(200)
              if method != "POST":
                  return resp(405)
              body = event.get("body") or ""
              if event.get("isBase64Encoded"):
                  import base64
                  try:
                      body = base64.b64decode(body).decode("utf-8", "replace")
                  except Exception:
                      return resp(400)
              if len(body) > 4096:
                  return resp(413)
              try:
                  d = json.loads(body)
              except Exception:
                  return resp(400)

              sid = clean(d.get("sid"), 64)
              ev = d.get("ev")
              if not sid or ev not in EVENTS:
                  return resp(400)
              scene = clean(d.get("scene"), 80)
              ref = clean(d.get("ref"), 120)
              try:
                  dur = int(d.get("dur", 0))
              except Exception:
                  dur = 0
              dur = max(0, min(dur, 86400))
              now = int(time.time())
              # sk groups by event so the reader can distinguish boot/scene/end.
              sk = f"{ev}#{now:013d}#{scene}"[:120]
              try:
                  table.put_item(Item={
                      "sessionId": sid,
                      "sk": sk,
                      "ev": ev,
                      "scene": scene,
                      "ref": ref,
                      "dur": dur,
                      "ts": now,
                      "ttl": now + RETENTION * 86400,
                  })
              except Exception:
                  return resp(500)
              return resp(204)

  # Public ingress is an API Gateway HTTP API (this account blocks public
  # Lambda Function URLs — AuthType NONE returns 403 despite a correct
  # resource policy, which is also why the main backend uses API Gateway).
  # HTTP API payload format v2.0 == Function URL event shape, so the Lambda
  # handlers are unchanged.
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: allbyte-studio-play-analytics
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref SiteDomain
          - http://localhost:4321
        AllowMethods: [GET, POST]
        AllowHeaders: [content-type, authorization]
        MaxAge: 3600

  HttpStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  WriteIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt WriteFunction.Arn
      IntegrationMethod: POST
      PayloadFormatVersion: "2.0"

  WriteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /play"
      Target: !Sub "integrations/${WriteIntegration}"

  WriteApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WriteFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

  # --- Read (admin-gated aggregate) ---------------------------------------
  ReadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-funnel
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !GetAtt PlayFunnelTable.Arn
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTable}"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:allbyte-studio/jwt-secret-*"

  ReadFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: allbyte-studio-play-funnel-read
      Runtime: python3.12
      Handler: index.handler
      Timeout: 15
      MemorySize: 256
      Role: !GetAtt ReadRole.Arn
      Environment:
        Variables:
          TABLE: !Ref PlayFunnelTable
          SITE_DOMAIN: !Ref SiteDomain
          USERS_TABLE: !Ref UsersTable
          ADMIN_EMAILS: !Ref AdminEmails
      Code:
        ZipFile: |
          import json, os, hmac, hashlib, base64, time, boto3

          table = boto3.resource("dynamodb").Table(os.environ["TABLE"])
          _USERS_TABLE = os.environ.get("USERS_TABLE") or ""
          users = boto3.resource("dynamodb").Table(_USERS_TABLE) if _USERS_TABLE else None
          # Optional comma-separated fallback allowlist. Primary gate is the tier
          # lookup below, so this is normally empty.
          ADMIN_EMAILS = {e.strip().lower() for e in (os.environ.get("ADMIN_EMAILS") or "").split(",") if e.strip()}
          _cache = {}

          def is_admin(payload):
              # Primary: real admin tier on the user's record — matches the rest
              # of the app, so ANY admin works with no per-email config.
              sub = payload.get("sub")
              if users is not None and sub:
                  try:
                      item = users.get_item(Key={"userId": sub}).get("Item")
                      if item and (item.get("tier") or "").strip().lower() == "admin":
                          return True
                  except Exception:
                      pass  # fall through to the email allowlist
              # Fallback: explicit allowlist (resilient if the tier lookup is
              # unavailable or mid tier-model migration).
              email = (payload.get("email") or "").strip().lower()
              return bool(email and email in ADMIN_EMAILS)

          def jwt_secret():
              if "s" not in _cache:
                  sm = boto3.client("secretsmanager")
                  _cache["s"] = sm.get_secret_value(SecretId="allbyte-studio/jwt-secret")["SecretString"]
              return _cache["s"]

          def verify_jwt(token, secret):
              parts = token.split(".")
              if len(parts) != 3:
                  return None
              sig_input = f"{parts[0]}.{parts[1]}"
              expected = base64.urlsafe_b64encode(
                  hmac.new(secret.encode(), sig_input.encode(), hashlib.sha256).digest()
              ).rstrip(b"=").decode()
              if not hmac.compare_digest(parts[2], expected):
                  return None
              pad = parts[1] + "=" * (4 - len(parts[1]) % 4)
              payload = json.loads(base64.urlsafe_b64decode(pad))
              if payload.get("exp", 0) < time.time():
                  return None
              return payload

          def resp(code, obj):
              return {"statusCode": code, "headers": {"content-type": "application/json"},
                      "body": json.dumps(obj)}

          def handler(event, context):
              method = event.get("requestContext", {}).get("http", {}).get("method", "")
              if method == "OPTIONS":
                  return {"statusCode": 200}
              auth = (event.get("headers", {}) or {}).get("authorization", "")
              if not auth.startswith("Bearer "):
                  return resp(401, {"error": "no token"})
              payload = verify_jwt(auth[7:], jwt_secret())
              if not payload:
                  return resp(401, {"error": "invalid token"})
              if not is_admin(payload):
                  return resp(403, {"error": "not admin"})

              # Low-volume aggregate: full scan is fine for now (TTL-bounded).
              sessions = {}
              kwargs = {}
              while True:
                  page = table.scan(**kwargs)
                  for it in page.get("Items", []):
                      sid = it["sessionId"]
                      s = sessions.setdefault(sid, {"scenes": set(), "dur": 0, "ref": ""})
                      sc = it.get("scene")
                      if sc:
                          s["scenes"].add(sc)
                      s["dur"] = max(s["dur"], int(it.get("dur", 0)))
                      if it.get("ref") and not s["ref"]:
                          s["ref"] = it["ref"]
                  lek = page.get("LastEvaluatedKey")
                  if not lek:
                      break
                  kwargs["ExclusiveStartKey"] = lek

              scene_counts = {}
              ref_counts = {}
              durs = []
              for s in sessions.values():
                  for sc in s["scenes"]:
                      scene_counts[sc] = scene_counts.get(sc, 0) + 1
                  if s["ref"]:
                      ref_counts[s["ref"]] = ref_counts.get(s["ref"], 0) + 1
                  if s["dur"] > 0:
                      durs.append(s["dur"])

              durs.sort()
              median = durs[len(durs)//2] if durs else 0
              # "booted" = reached any scene; "moved" = fired the m:moved stage.
              # bootedNoMove = booted players who never moved — the prime
              # control-confusion signal (they loaded but didn't know how to play).
              booted = sum(1 for s in sessions.values() if s["scenes"])
              moved = sum(1 for s in sessions.values() if "m:moved" in s["scenes"])
              return resp(200, {
                  "totalSessions": len(sessions),
                  "bootedSessions": booted,
                  "movedSessions": moved,
                  "bootedNoMove": booted - moved,
                  "sceneCounts": scene_counts,
                  "referrers": ref_counts,
                  "medianDurationSec": median,
                  "generatedAt": int(time.time()),
              })

  ReadIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ReadFunction.Arn
      IntegrationMethod: POST
      PayloadFormatVersion: "2.0"

  ReadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /funnel"
      Target: !Sub "integrations/${ReadIntegration}"

  ReadApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReadFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

Outputs:
  WriteEndpoint:
    Description: POST scene beacons here (set as the frontend write URL).
    Value: !Sub "${HttpApi.ApiEndpoint}/play"
  ReadEndpoint:
    Description: Admin-gated GET funnel aggregate (Bearer JWT).
    Value: !Sub "${HttpApi.ApiEndpoint}/funnel"
  TableName:
    Value: !Ref PlayFunnelTable
