  UserAnalyticsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: allbyte-studio-user-analytics
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          TABLE_NAME: !Ref SubscriptionsTable
