AWSTemplateFormatVersion: "2010-09-09"
Description: AllByte Studios backend (Auth + Stripe + API Gateway + Lambda + DynamoDB)

Parameters:
  StripePriceInitiate:
    Type: String
    Default: price_1TJfoPL0A07AB3XunnJwtSwi
  StripePriceHero:
    Type: String
    Default: price_1TJfoQL0A07AB3XuczyqJc99
  StripePriceLegend:
    Type: String
    Default: price_1TJfoQL0A07AB3Xu9WXvyUvs
  StripePriceDonate5:
    Type: String
    Default: price_1TJfoRL0A07AB3XuzHlal9l6
  StripePriceDonate10:
    Type: String
    Default: price_1TJfoRL0A07AB3XulyU6BbL0
  StripePriceDonate25:
    Type: String
    Default: price_1TJfoSL0A07AB3XuKo0Mea0w
  SiteDomain:
    Type: String
    Default: https://allbyte.studio
  FromEmail:
    Type: String
    Default: notifications@allbyte.studio
  InitialAdminEmail:
    Type: String
    Default: allbytestudios@gmail.com
    Description: Email of the user to auto-promote to admin tier on next /auth/me call. One-time bootstrap; idempotent.
  MonthlyBudgetLimit:
    Type: Number
    Default: 25
    Description: Monthly AWS budget in USD for the budget status endpoint.
  ApiCustomDomain:
    Type: String
    Default: api.allbyte.studio
    Description: Custom domain for the HTTP API. Shown to users on the Google OAuth consent screen.
  HostedZoneId:
    Type: String
    Default: Z01925952NW3G7UBHQ76M
    Description: Route 53 hosted zone ID for allbyte.studio. Used for cert DNS validation and the API alias record.

Resources:
  # --- DynamoDB Tables ---
  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: allbyte-studio-subscriptions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: customerId
          AttributeType: S
      KeySchema:
        - AttributeName: customerId
          KeyType: HASH

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: allbyte-studio-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: stripeCustomerId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: stripeCustomerId-index
          KeySchema:
            - AttributeName: stripeCustomerId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # --- S3 Bucket: Game Pack Storage (private, never public) ---
  # Holds zone packs (Core.pck, LariaVillage.pck, etc.) downloaded by the
  # game client via short-lived signed URLs minted by GetPckUrlFunction.
  # Versioning enabled so a new pack upload doesn't break in-flight sessions.
  PacksBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: allbyte-studio-packs
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveOldVersions
            Status: Enabled
            NoncurrentVersionTransitions:
              - TransitionInDays: 30
                StorageClass: GLACIER
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET]
            AllowedOrigins:
              - !Ref SiteDomain
              - "http://localhost:4321"
              - "http://localhost:4322"
            AllowedHeaders: ["*"]
            MaxAge: 3600

  # --- IAM Role for Lambdas ---
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: allbyte-studio-stripe-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BackendPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt SubscriptionsTable.Arn
                  - !GetAtt UsersTable.Arn
                  - !Sub "${UsersTable.Arn}/index/*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:ListSecrets
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:allbyte-studio/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource:
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/allbyte.studio"
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "arn:aws:s3:::allbyte-studio-packs/*"
              - Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                Resource: "*"
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricStatistics
                Resource: "*"
              # Athena + Glue + S3 access for the SiteTrafficFunction, which
              # queries CloudFront access logs to classify traffic into
              # owner / bots / other. Glue catalog hosts the external table
              # over s3://allbyte.studio-access-logs/cf-logs/. Athena writes
              # query results to s3://allbyte-studio-cfn-deploy/athena-results/
              # (no separate bucket; cfn-deploy already exists for CFN packaging).
              # The Lambda also caches the daily aggregate JSON in the same
              # bucket under traffic-cache/ to avoid re-querying Athena on
              # every dashboard refresh.
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:StopQueryExecution
                Resource: "*"
              - Effect: Allow
                Action:
                  - glue:GetTable
                  - glue:GetDatabase
                  - glue:GetPartitions
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:CreateDatabase
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - "arn:aws:s3:::allbyte.studio-access-logs"
                  - "arn:aws:s3:::allbyte.studio-access-logs/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - "arn:aws:s3:::allbyte-studio-cfn-deploy"
                  - "arn:aws:s3:::allbyte-studio-cfn-deploy/*"
  # --- Lambda: Auth Me (verify token, get profile) ---
  MeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: allbyte-studio-auth-me
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
          SITE_DOMAIN: !Ref SiteDomain
          PRICE_INITIATE: !Ref StripePriceInitiate
          PRICE_HERO: !Ref StripePriceHero
          PRICE_LEGEND: !Ref StripePriceLegend
          INITIAL_ADMIN_EMAIL: !Ref InitialAdminEmail
      Code:
        ZipFile: |
          import json
          import os
          import hashlib
          import hmac
          import base64
          import time
          import boto3

          users = boto3.resource("dynamodb").Table(os.environ["USERS_TABLE"])
          subs = boto3.resource("dynamodb").Table(os.environ["SUBSCRIPTIONS_TABLE"])
          INITIAL_ADMIN_EMAIL = os.environ.get("INITIAL_ADMIN_EMAIL", "").strip().lower()
          VALID_TIERS = {"default", "initiate", "hero", "legend", "admin"}

          CORS = {
              "Access-Control-Allow-Origin": os.environ["SITE_DOMAIN"],
              "Access-Control-Allow-Headers": "Content-Type,Authorization",
              "Access-Control-Allow-Methods": "GET,OPTIONS",
          }

          _cache = {}
          def get_jwt_secret():
              if "jwt" not in _cache:
                  sm = boto3.client("secretsmanager")
                  _cache["jwt"] = sm.get_secret_value(SecretId="allbyte-studio/jwt-secret")["SecretString"]
              return _cache["jwt"]

          def verify_jwt(token, secret):
              parts = token.split(".")
              if len(parts) != 3:
                  return None
              sig_input = f"{parts[0]}.{parts[1]}"
              expected_sig = base64.urlsafe_b64encode(
                  hmac.new(secret.encode(), sig_input.encode(), hashlib.sha256).digest()
              ).rstrip(b"=").decode()
              if not hmac.compare_digest(parts[2], expected_sig):
                  return None
              # Decode payload (add padding)
              payload_b64 = parts[1] + "=" * (4 - len(parts[1]) % 4)
              payload = json.loads(base64.urlsafe_b64decode(payload_b64))
              if payload.get("exp", 0) < time.time():
                  return None
              return payload

          def compute_tier_from_subscription(stripe_customer_id):
              """Legacy fallback: compute tier by joining SubscriptionsTable."""
              if not stripe_customer_id:
                  return "default"
              price_to_tier = {
                  os.environ["PRICE_INITIATE"]: "initiate",
                  os.environ["PRICE_HERO"]: "hero",
                  os.environ["PRICE_LEGEND"]: "legend",
              }
              try:
                  resp = subs.get_item(Key={"customerId": stripe_customer_id})
                  item = resp.get("Item", {})
                  if item.get("status") == "active":
                      return price_to_tier.get(item.get("priceId"), "default")
              except Exception:
                  pass
              return "default"

          def resolve_tier(user):
              """Source-of-truth tier read with read-through migration + admin
              bootstrap. Returns the canonical tier string (one of VALID_TIERS).
              Writes back to UsersTable when migrating or promoting."""
              user_id = user["userId"]
              email = (user.get("email") or "").strip().lower()
              stored = user.get("tier")

              # Step 1: read-through migration. If no tier on the record yet,
              # compute from the legacy Stripe subscription join and write back.
              if stored not in VALID_TIERS:
                  computed = compute_tier_from_subscription(user.get("stripeCustomerId"))
                  try:
                      users.update_item(
                          Key={"userId": user_id},
                          UpdateExpression="SET #t = :t",
                          ExpressionAttributeNames={"#t": "tier"},
                          ExpressionAttributeValues={":t": computed},
                      )
                  except Exception:
                      pass
                  stored = computed

              # Step 2: admin bootstrap. If this user matches the seed email,
              # promote to admin (idempotent — no-op when already admin).
              if (
                  INITIAL_ADMIN_EMAIL
                  and email == INITIAL_ADMIN_EMAIL
                  and stored != "admin"
              ):
                  try:
                      users.update_item(
                          Key={"userId": user_id},
                          UpdateExpression="SET #t = :t",
                          ExpressionAttributeNames={"#t": "tier"},
                          ExpressionAttributeValues={":t": "admin"},
                      )
                      stored = "admin"
                  except Exception:
                      pass

              return stored

          def err(code, msg):
              return {"statusCode": code, "headers": CORS, "body": json.dumps({"error": msg})}

          def handler(event, context):
              if event.get("requestContext", {}).get("http", {}).get("method") == "OPTIONS":
                  return {"statusCode": 200, "headers": CORS}

              auth = event.get("headers", {}).get("authorization", "")
              if not auth.startswith("Bearer "):
                  return err(401, "No token provided")

              token = auth[7:]
              jwt_secret = get_jwt_secret()
              payload = verify_jwt(token, jwt_secret)
              if not payload:
                  return err(401, "Invalid or expired token")

              resp = users.get_item(Key={"userId": payload["sub"]})
              user = resp.get("Item")
              if not user:
                  return err(401, "User not found")

              tier = resolve_tier(user)

              prefs = user.get("notificationPreferences")
              if prefs:
                  prefs = {k: bool(v) for k, v in prefs.items()}

              return {
                  "statusCode": 200,
                  "headers": CORS,
                  "body": json.dumps({
                      "user": {
                          "userId": user["userId"],
                          "email": user["email"],
                          "username": user["username"],
                          "tier": tier,
                          "stripeCustomerId": user.get("stripeCustomerId"),
                          "notificationPreferences": prefs,
                      },
                  }),
              }

  # --- Lambda: Notification Preferences ---
  NotificationPrefsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: allbyte-studio-notification-prefs
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          SITE_DOMAIN: !Ref SiteDomain
      Code:
        ZipFile: |
          import json
          import os
          import hashlib
          import hmac
          import base64
          import time
          import boto3

          users = boto3.resource("dynamodb").Table(os.environ["USERS_TABLE"])

          CORS = {
              "Access-Control-Allow-Origin": os.environ["SITE_DOMAIN"],
              "Access-Control-Allow-Headers": "Content-Type,Authorization",
              "Access-Control-Allow-Methods": "PUT,OPTIONS",
          }

          VALID_KEYS = {"chronicles", "godot-and-claude", "studio", "music", "artwork", "fonts"}

          _cache = {}
          def get_jwt_secret():
              if "jwt" not in _cache:
                  sm = boto3.client("secretsmanager")
                  _cache["jwt"] = sm.get_secret_value(SecretId="allbyte-studio/jwt-secret")["SecretString"]
              return _cache["jwt"]

          def verify_jwt(token, secret):
              parts = token.split(".")
              if len(parts) != 3:
                  return None
              sig_input = f"{parts[0]}.{parts[1]}"
              expected_sig = base64.urlsafe_b64encode(
                  hmac.new(secret.encode(), sig_input.encode(), hashlib.sha256).digest()
              ).rstrip(b"=").decode()
              if not hmac.compare_digest(parts[2], expected_sig):
                  return None
              payload_b64 = parts[1] + "=" * (4 - len(parts[1]) % 4)
              payload = json.loads(base64.urlsafe_b64decode(payload_b64))
              if payload.get("exp", 0) < time.time():
                  return None
              return payload

          def err(code, msg):
              return {"statusCode": code, "headers": CORS, "body": json.dumps({"error": msg})}

          def handler(event, context):
              if event.get("requestContext", {}).get("http", {}).get("method") == "OPTIONS":
                  return {"statusCode": 200, "headers": CORS}

              auth = event.get("headers", {}).get("authorization", "")
              if not auth.startswith("Bearer "):
                  return err(401, "Login required")

              payload = verify_jwt(auth[7:], get_jwt_secret())
              if not payload:
                  return err(401, "Invalid or expired token")

              user_id = payload["sub"]

              body = json.loads(event.get("body", "{}"))
              preferences = body.get("preferences")

              if preferences is None:
                  users.update_item(
                      Key={"userId": user_id},
                      UpdateExpression="REMOVE notificationPreferences",
                  )
                  return {
                      "statusCode": 200,
                      "headers": CORS,
                      "body": json.dumps({"preferences": None}),
                  }

              if not isinstance(preferences, dict):
                  return err(400, "preferences must be an object or null")
              if set(preferences.keys()) != VALID_KEYS:
                  return err(400, f"preferences must contain exactly: {', '.join(sorted(VALID_KEYS))}")
              if not all(isinstance(v, bool) for v in preferences.values()):
                  return err(400, "All preference values must be boolean")

              users.update_item(
                  Key={"userId": user_id},
                  UpdateExpression="SET notificationPreferences = :p",
                  ExpressionAttributeValues={":p": preferences},
              )

              return {
                  "statusCode": 200,
                  "headers": CORS,
                  "body": json.dumps({"preferences": preferences}),
              }

  # --- Lambda: Save Sync (Hero/Legend tier game saves) ---
  SaveSyncFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: allbyte-studio-save-sync
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
          SITE_DOMAIN: !Ref SiteDomain
          PRICE_INITIATE: !Ref StripePriceInitiate
          PRICE_HERO: !Ref StripePriceHero
          PRICE_LEGEND: !Ref StripePriceLegend
      Code:
        ZipFile: |
          import json
          import os
          import hashlib
          import hmac
          import base64
          import time
          import datetime
          import boto3

          users = boto3.resource("dynamodb").Table(os.environ["USERS_TABLE"])
          subs = boto3.resource("dynamodb").Table(os.environ["SUBSCRIPTIONS_TABLE"])

          CORS = {
              "Access-Control-Allow-Origin": os.environ["SITE_DOMAIN"],
              "Access-Control-Allow-Headers": "Content-Type,Authorization",
              "Access-Control-Allow-Methods": "GET,PUT,DELETE,OPTIONS",
          }

          MAX_SAVE_BYTES = 250 * 1024  # 250KB

          _cache = {}
          def get_jwt_secret():
              if "jwt" not in _cache:
                  sm = boto3.client("secretsmanager")
                  _cache["jwt"] = sm.get_secret_value(SecretId="allbyte-studio/jwt-secret")["SecretString"]
              return _cache["jwt"]

          def verify_jwt(token, secret):
              parts = token.split(".")
              if len(parts) != 3:
                  return None
              sig_input = f"{parts[0]}.{parts[1]}"
              expected_sig = base64.urlsafe_b64encode(
                  hmac.new(secret.encode(), sig_input.encode(), hashlib.sha256).digest()
              ).rstrip(b"=").decode()
              if not hmac.compare_digest(parts[2], expected_sig):
                  return None
              payload_b64 = parts[1] + "=" * (4 - len(parts[1]) % 4)
              payload = json.loads(base64.urlsafe_b64decode(payload_b64))
              if payload.get("exp", 0) < time.time():
                  return None
              return payload

          def get_tier(stripe_customer_id):
              if not stripe_customer_id:
                  return None
              price_to_tier = {
                  os.environ["PRICE_INITIATE"]: "initiate",
                  os.environ["PRICE_HERO"]: "hero",
                  os.environ["PRICE_LEGEND"]: "legend",
              }
              try:
                  resp = subs.get_item(Key={"customerId": stripe_customer_id})
                  item = resp.get("Item", {})
                  if item.get("status") == "active":
                      return price_to_tier.get(item.get("priceId"))
              except Exception:
                  pass
              return None

          def err(code, msg):
              return {"statusCode": code, "headers": CORS, "body": json.dumps({"error": msg})}

          def handler(event, context):
              method = event.get("requestContext", {}).get("http", {}).get("method", "")
              if method == "OPTIONS":
                  return {"statusCode": 200, "headers": CORS}

              auth = event.get("headers", {}).get("authorization", "")
              if not auth.startswith("Bearer "):
                  return err(401, "Login required")

              payload = verify_jwt(auth[7:], get_jwt_secret())
              if not payload:
                  return err(401, "Invalid or expired token")

              user_id = payload["sub"]

              # Look up user to check tier
              user_resp = users.get_item(Key={"userId": user_id})
              user = user_resp.get("Item")
              if not user:
                  return err(401, "User not found")

              # Tier lives on the user record (written by Patreon login + the
              # pledge webhook). The legacy Stripe SubscriptionsTable lookup is
              # gone with the Patreon migration.
              tier = user.get("tier")
              if tier not in ("hero", "legend"):
                  return err(403, "Save sync requires a Hero or Legend membership")

              if method == "GET":
                  save_data = user.get("saveData")
                  if not save_data:
                      return {
                          "statusCode": 404,
                          "headers": CORS,
                          "body": json.dumps({"error": "No saved data"}),
                      }
                  return {
                      "statusCode": 200,
                      "headers": CORS,
                      "body": json.dumps({
                          "saves": save_data,
                          "updatedAt": user.get("saveDataUpdatedAt"),
                      }),
                  }

              if method == "PUT":
                  body = json.loads(event.get("body", "{}"))
                  saves_blob = body.get("saves")
                  if not isinstance(saves_blob, str):
                      return err(400, "saves must be a JSON-encoded string")
                  if len(saves_blob.encode("utf-8")) > MAX_SAVE_BYTES:
                      return err(413, f"Save data exceeds maximum size of {MAX_SAVE_BYTES} bytes")
                  # Validate it parses as JSON (don't validate schema)
                  try:
                      json.loads(saves_blob)
                  except Exception:
                      return err(400, "saves must be valid JSON")

                  now = datetime.datetime.utcnow().isoformat() + "Z"
                  users.update_item(
                      Key={"userId": user_id},
                      UpdateExpression="SET saveData = :s, saveDataUpdatedAt = :t",
                      ExpressionAttributeValues={":s": saves_blob, ":t": now},
                  )
                  return {
                      "statusCode": 200,
                      "headers": CORS,
                      "body": json.dumps({"updatedAt": now}),
                  }

              if method == "DELETE":
                  users.update_item(
                      Key={"userId": user_id},
                      UpdateExpression="REMOVE saveData, saveDataUpdatedAt",
                  )
                  return {
                      "statusCode": 200,
                      "headers": CORS,
                      "body": json.dumps({"deleted": True}),
                  }

              return err(405, f"Method {method} not allowed")

  # --- Lambda: Send Notification Email ---
  SendNotificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: allbyte-studio-send-notification
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          SITE_DOMAIN: !Ref SiteDomain
          FROM_EMAIL: !Ref FromEmail
      Code:
        ZipFile: |
          import json
          import os
          import hashlib
          import hmac
          import base64
          import time
          import boto3

          users = boto3.resource("dynamodb").Table(os.environ["USERS_TABLE"])
          ses = boto3.client("ses")
          FROM = os.environ["FROM_EMAIL"]
          SITE = os.environ["SITE_DOMAIN"]

          _cache = {}
          def get_jwt_secret():
              if "jwt" not in _cache:
                  sm = boto3.client("secretsmanager")
                  _cache["jwt"] = sm.get_secret_value(SecretId="allbyte-studio/jwt-secret")["SecretString"]
              return _cache["jwt"]

          def make_unsubscribe_token(user_id, secret):
              expiry = int(time.time()) + 90 * 86400
              data = f"{user_id}:{expiry}"
              sig = hmac.new(secret.encode(), data.encode(), hashlib.sha256).hexdigest()
              raw = f"{data}:{sig}"
              return base64.urlsafe_b64encode(raw.encode()).decode()

          CATEGORY_LABELS = {
              "chronicles": "Chronicles of Nesis",
              "godot-and-claude": "Godot & Claude",
              "studio": "AllByte Studios",
              "music": "Music",
              "artwork": "Artwork",
              "fonts": "Font",
          }

          def handler(event, context):
              category = event.get("category", "")
              title = event.get("title", "")
              description = event.get("description", "")
              url = event.get("url", "")

              if not category or not title:
                  return {"error": "category and title required"}

              label = CATEGORY_LABELS.get(category, category)
              secret = get_jwt_secret()

              # Scan for users with this category preference enabled
              result = users.scan(
                  FilterExpression="attribute_exists(notificationPreferences) AND notificationPreferences.#cat = :t",
                  ExpressionAttributeNames={"#cat": category},
                  ExpressionAttributeValues={":t": True},
              )
              items = result.get("Items", [])
              while result.get("LastEvaluatedKey"):
                  result = users.scan(
                      FilterExpression="attribute_exists(notificationPreferences) AND notificationPreferences.#cat = :t",
                      ExpressionAttributeNames={"#cat": category},
                      ExpressionAttributeValues={":t": True},
                      ExclusiveStartKey=result["LastEvaluatedKey"],
                  )
                  items.extend(result.get("Items", []))

              sent = 0
              api_base = SITE.replace("https://", "https://api.allbyte.studio")
              for user in items:
                  email = user.get("email")
                  user_id = user.get("userId")
                  if not email:
                      continue

                  token = make_unsubscribe_token(user_id, secret)
                  unsub_url = f"https://api.allbyte.studio/auth/unsubscribe?token={token}"

                  text_body = f"""{title}
          {description}

          Read it here: {url}

          ---
          You're receiving this because you opted into {label} updates on allbyte.studio.
          Unsubscribe: {unsub_url}"""

                  html_body = f"""<!DOCTYPE html>
