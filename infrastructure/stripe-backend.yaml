  # --- Lambda: Unsubscribe ---
  UnsubscribeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: allbyte-studio-unsubscribe
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          SITE_DOMAIN: !Ref SiteDomain
      Code:
        ZipFile: |
          import json
          import os
          import hashlib
          import hmac
          import base64
          import time
          import urllib.parse
          import boto3

          users = boto3.resource("dynamodb").Table(os.environ["USERS_TABLE"])
          SITE = os.environ["SITE_DOMAIN"]

          _cache = {}
          def get_jwt_secret():
              if "jwt" not in _cache:
                  sm = boto3.client("secretsmanager")
                  _cache["jwt"] = sm.get_secret_value(SecretId="allbyte-studio/jwt-secret")["SecretString"]
              return _cache["jwt"]

          def handler(event, context):
              qs = event.get("queryStringParameters") or {}
              token_b64 = qs.get("token", "")

              try:
                  raw = base64.urlsafe_b64decode(token_b64.encode()).decode()
                  parts = raw.split(":")
                  if len(parts) != 3:
                      raise ValueError("bad format")
                  user_id, expiry_str, sig = parts
                  expiry = int(expiry_str)

                  secret = get_jwt_secret()
                  expected = hmac.new(secret.encode(), f"{user_id}:{expiry_str}".encode(), hashlib.sha256).hexdigest()
                  if not hmac.compare_digest(sig, expected):
                      raise ValueError("bad sig")
                  if time.time() > expiry:
                      raise ValueError("expired")

              except Exception:
                  return {
                      "statusCode": 302,
                      "headers": {"Location": f"{SITE}/unsubscribed/?error=invalid"},
                  }

              try:
                  users.update_item(
                      Key={"userId": user_id},
                      UpdateExpression="REMOVE notificationPreferences",
                  )
              except Exception:
                  pass

              return {
                  "statusCode": 302,
                  "headers": {"Location": f"{SITE}/unsubscribed/"},
              }

  # --- Lambda: OAuth Start (redirect to provider) ---
  OAuthStartFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: allbyte-studio-oauth-start
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          SITE_DOMAIN: !Ref SiteDomain
      Code:
        ZipFile: |
          import json
          import os
          import hashlib
          import hmac
          import base64
          import time
          import urllib.parse
          import boto3

          PROVIDERS = {
              "patreon": {
                  "secret_name": "allbyte-studio/patreon-oauth",
                  "auth_url": "https://www.patreon.com/oauth2/authorize",
                  "scope": "identity identity[email] identity.memberships",
              },
          }

          def get_secret(name):
              if name not in _cache:
                  sm = boto3.client("secretsmanager")
                  raw = sm.get_secret_value(SecretId=name)["SecretString"].strip().strip("{}")
                  parts = {}
                  for pair in raw.split(","):
                      key, _, value = pair.partition(":")
                      parts[key.strip()] = value.strip()
                  _cache[name] = {"client_id": parts["client_id"], "client_secret": parts["client_secret"]}
              return _cache[name]

          _cache = {}
          def get_jwt_secret():
              if "jwt" not in _cache:
                  sm = boto3.client("secretsmanager")
                  _cache["jwt"] = sm.get_secret_value(SecretId="allbyte-studio/jwt-secret")["SecretString"]
              return _cache["jwt"]

          def make_state(jwt_secret):
              ts = hex(int(time.time()))[2:]
              sig = hmac.new(jwt_secret.encode(), ts.encode(), hashlib.sha256).hexdigest()[:32]
              return f"{ts}.{sig}"

          def handler(event, context):
              provider = event.get("pathParameters", {}).get("provider", "")
              if provider not in PROVIDERS:
                  return {"statusCode": 400, "body": json.dumps({"error": "Unknown provider"})}

              cfg = PROVIDERS[provider]
              creds = get_secret(cfg["secret_name"])
              jwt_secret = get_jwt_secret()

              domain = event["requestContext"]["domainName"]
              redirect_uri = f"https://{domain}/auth/oauth/{provider}/callback"

              state = make_state(jwt_secret)

              params = {
                  "client_id": creds["client_id"],
                  "redirect_uri": redirect_uri,
                  "response_type": "code",
                  "scope": cfg["scope"],
                  "state": state,
              }

              url = f"{cfg['auth_url']}?{urllib.parse.urlencode(params)}"

              return {
                  "statusCode": 302,
                  "headers": {"Location": url},
              }

  # --- Lambda: OAuth Callback (exchange code, create/link user) ---
  OAuthCallbackFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: allbyte-studio-oauth-callback
      Runtime: python3.12
      Handler: index.handler
      Timeout: 15
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
          SITE_DOMAIN: !Ref SiteDomain
          PRICE_INITIATE: !Ref StripePriceInitiate
          PRICE_HERO: !Ref StripePriceHero
          PRICE_LEGEND: !Ref StripePriceLegend
      Code:
        ZipFile: |
          import json
          import os
          import uuid
          import hashlib
          import hmac
          import base64
          import time
          import urllib.request
          import urllib.parse
          import boto3

          users = boto3.resource("dynamodb").Table(os.environ["USERS_TABLE"])
          subs = boto3.resource("dynamodb").Table(os.environ["SUBSCRIPTIONS_TABLE"])
          site = os.environ["SITE_DOMAIN"]

          PROVIDERS = {
              "patreon": {
                  "secret_name": "allbyte-studio/patreon-oauth",
                  "token_url": "https://www.patreon.com/api/oauth2/token",
                  # identity + the caller's memberships in OUR campaign, with the
                  # entitled tier(s) and the pledge amount. fields[] selects only
                  # what we map. Brackets URL-encoded for the GET.
                  "userinfo_url": (
                      "https://www.patreon.com/api/oauth2/v2/identity"
                      "?include=memberships.currently_entitled_tiers"
                      "&fields%5Buser%5D=email,full_name"
                      "&fields%5Bmember%5D=patron_status,currently_entitled_amount_cents"
                  ),
              },
          }

          # Patreon tier mapping. Primary: entitled tier id -> our tier (set the
          # PATREON_TIER_* env vars once the real campaign tier ids are known).
          # Fallback (works today, no ids needed): pledge amount in cents.
          PATREON_TIER_IDS = {
              "28882017": "initiate",  # $3  (campaign 16252801)
              "28882292": "hero",      # $7
              "28882311": "legend",    # $15
          }
          PATREON_AMOUNT_TIERS = [(1500, "legend"), (700, "hero"), (300, "initiate")]

          def patreon_tier(profile):
              """Resolve the caller's tier from a Patreon /identity payload.
              active_patron only; tier-id match first, amount-cents fallback."""
              included = profile.get("included", []) or []
              for inc in included:
                  if inc.get("type") != "member":
                      continue
                  a = inc.get("attributes", {}) or {}
                  if a.get("patron_status") != "active_patron":
                      continue
                  rels = (inc.get("relationships", {}) or {}).get("currently_entitled_tiers", {})
                  for t in (rels.get("data", []) or []):
                      mapped = PATREON_TIER_IDS.get(str(t.get("id", "")))
                      if mapped and t.get("id"):
                          return mapped
                  cents = a.get("currently_entitled_amount_cents") or 0
                  for threshold, name in PATREON_AMOUNT_TIERS:
                      if cents >= threshold:
                          return name
              return "default"

          def get_secret(name):
              if name not in _cache:
                  sm = boto3.client("secretsmanager")
                  raw = sm.get_secret_value(SecretId=name)["SecretString"].strip().strip("{}")
                  parts = {}
                  for pair in raw.split(","):
                      key, _, value = pair.partition(":")
                      parts[key.strip()] = value.strip()
                  _cache[name] = {"client_id": parts["client_id"], "client_secret": parts["client_secret"]}
              return _cache[name]

          _cache = {}
          def get_jwt_secret():
              if "jwt" not in _cache:
                  sm = boto3.client("secretsmanager")
                  _cache["jwt"] = sm.get_secret_value(SecretId="allbyte-studio/jwt-secret")["SecretString"]
              return _cache["jwt"]

          def verify_state(state, jwt_secret):
              parts = state.split(".")
              if len(parts) != 2:
                  return False
              ts_hex, sig = parts
              expected = hmac.new(jwt_secret.encode(), ts_hex.encode(), hashlib.sha256).hexdigest()[:32]
              if not hmac.compare_digest(sig, expected):
                  return False
              ts = int(ts_hex, 16)
              if abs(time.time() - ts) > 600:
                  return False
              return True

          def sign_jwt(payload, secret):
              header = base64.urlsafe_b64encode(json.dumps({"alg": "HS256", "typ": "JWT"}).encode()).rstrip(b"=").decode()
              body = base64.urlsafe_b64encode(json.dumps(payload).encode()).rstrip(b"=").decode()
              sig_input = f"{header}.{body}"
              sig = base64.urlsafe_b64encode(
                  hmac.new(secret.encode(), sig_input.encode(), hashlib.sha256).digest()
              ).rstrip(b"=").decode()
              return f"{header}.{body}.{sig}"

          def http_post_form(url, data, headers=None):
              body = urllib.parse.urlencode(data).encode()
              req = urllib.request.Request(url, data=body, method="POST")
              req.add_header("Content-Type", "application/x-www-form-urlencoded")
              if headers:
                  for k, v in headers.items():
                      req.add_header(k, v)
              resp = urllib.request.urlopen(req)
              return json.loads(resp.read())

          def http_get_json(url, token):
              req = urllib.request.Request(url)
              req.add_header("Authorization", f"Bearer {token}")
              resp = urllib.request.urlopen(req)
              return json.loads(resp.read())

          def get_tier(stripe_customer_id):
              if not stripe_customer_id:
                  return None
              price_to_tier = {
                  os.environ["PRICE_INITIATE"]: "initiate",
                  os.environ["PRICE_HERO"]: "hero",
                  os.environ["PRICE_LEGEND"]: "legend",
              }
              try:
                  resp = subs.get_item(Key={"customerId": stripe_customer_id})
                  item = resp.get("Item", {})
                  if item.get("status") == "active":
                      return price_to_tier.get(item.get("priceId"))
              except Exception:
                  pass
              return None

          def redirect_error(msg):
              return {"statusCode": 302, "headers": {"Location": f"{site}/#auth_error={urllib.parse.quote(msg)}"}}

          def handler(event, context):
              provider = event.get("pathParameters", {}).get("provider", "")
              if provider not in PROVIDERS:
                  return redirect_error("Unknown provider")

              qs = event.get("queryStringParameters") or {}
              code = qs.get("code")
              state = qs.get("state", "")

              if not code:
                  error_desc = qs.get("error_description", qs.get("error", "Authorization denied"))
                  return redirect_error(error_desc)

              jwt_secret = get_jwt_secret()
              if not verify_state(state, jwt_secret):
                  return redirect_error("Invalid state parameter")

              cfg = PROVIDERS[provider]
              creds = get_secret(cfg["secret_name"])
              domain = event["requestContext"]["domainName"]
              redirect_uri = f"https://{domain}/auth/oauth/{provider}/callback"

              # Exchange code for access token
              try:
                  token_data = http_post_form(cfg["token_url"], {
                      "client_id": creds["client_id"],
                      "client_secret": creds["client_secret"],
                      "code": code,
                      "redirect_uri": redirect_uri,
                      "grant_type": "authorization_code",
                  })
              except Exception as e:
                  return redirect_error(f"Token exchange failed: {e}")

              access_token = token_data.get("access_token")
              if not access_token:
                  return redirect_error("No access token received")

              # Fetch user profile
              try:
                  profile = http_get_json(cfg["userinfo_url"], access_token)
              except Exception as e:
                  return redirect_error(f"Failed to fetch profile: {e}")

              # Extract email and name (Patreon is the only provider).
              data = profile.get("data", {}) or {}
              attrs = data.get("attributes", {}) or {}
              email = (attrs.get("email") or "").strip().lower()
              display_name = attrs.get("full_name") or (email.split("@")[0] if email else "Patron")
              oauth_id = data.get("id", "")

              if not email:
                  return redirect_error("No email provided by provider")

              # Find or create user
              resp = users.query(
                  IndexName="email-index",
                  KeyConditionExpression="email = :e",
                  ExpressionAttributeValues={":e": email},
              )
              items = resp.get("Items", [])

              if items:
                  user = items[0]
                  # Link OAuth to existing account
                  users.update_item(
                      Key={"userId": user["userId"]},
                      UpdateExpression="SET oauthProvider = :p, oauthId = :oid",
                      ExpressionAttributeValues={":p": provider, ":oid": oauth_id},
                  )
              else:
                  user_id = str(uuid.uuid4())
                  now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
                  user = {
                      "userId": user_id,
                      "email": email,
                      "username": display_name,
                      "oauthProvider": provider,
                      "oauthId": oauth_id,
                      "createdAt": now,
                      "tier": "default",
                  }
                  users.put_item(Item=user)

              # Patreon is the tier source of truth: persist the tier read from
              # the caller's membership so MeFunction (which reads the stored
              # tier) returns it. The pledge webhook keeps it fresh afterward.
              if provider == "patreon":
                  users.update_item(
                      Key={"userId": user["userId"]},
                      UpdateExpression="SET #t = :t, patreonId = :pid",
                      ExpressionAttributeNames={"#t": "tier"},
                      ExpressionAttributeValues={":t": patreon_tier(profile), ":pid": oauth_id},
                  )

              tier = get_tier(user.get("stripeCustomerId"))
              token = sign_jwt({
                  "sub": user["userId"],
                  "email": user["email"],
                  "username": user.get("username", ""),
                  "exp": int(time.time()) + 7 * 86400,
              }, jwt_secret)

              return {
                  "statusCode": 302,
                  "headers": {"Location": f"{site}/#token={token}"},
              }
  # --- Lambda: Stripe Webhook ---
  # --- Lambda: Patreon Webhook (keeps tier fresh on pledge changes) ---
  # Patreon POSTs member events here on pledge create/update/delete. Verifies
  # the HMAC-MD5 body signature, maps the membership to a tier, and writes it
  # to the user (matched by the patron's email via email-index). The OAuth
  # callback sets tier at login; this keeps it current between logins.
  PatreonWebhookFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: allbyte-studio-patreon-webhook
      Runtime: python3.12
      Handler: index.handler
      Timeout: 15
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
      Code:
        ZipFile: |
          import json
          import os
          import hmac
          import hashlib
          import base64
          import boto3

          users = boto3.resource("dynamodb").Table(os.environ["USERS_TABLE"])
          _cache = {}

          # Mirror the OAuth callback's mapping: tier-id override first (set the
          # PATREON_TIER_* env vars when ids are known), amount-cents fallback.
          PATREON_TIER_IDS = {
              "28882017": "initiate",  # $3  (campaign 16252801)
              "28882292": "hero",      # $7
              "28882311": "legend",    # $15
          }
          PATREON_AMOUNT_TIERS = [(1500, "legend"), (700, "hero"), (300, "initiate")]

          def get_webhook_secret():
              if "s" not in _cache:
                  sm = boto3.client("secretsmanager")
                  _cache["s"] = sm.get_secret_value(
                      SecretId="allbyte-studio/patreon-webhook-secret"
                  )["SecretString"].strip()
              return _cache["s"]

          def tier_from_member(data, is_delete):
              if is_delete:
                  return "default"
              attrs = data.get("attributes", {}) or {}
              if attrs.get("patron_status") != "active_patron":
                  return "default"
              rels = (data.get("relationships", {}) or {}).get("currently_entitled_tiers", {})
              for t in (rels.get("data", []) or []):
                  mapped = PATREON_TIER_IDS.get(str(t.get("id", "")))
                  if mapped and t.get("id"):
                      return mapped
              cents = attrs.get("currently_entitled_amount_cents") or 0
              for threshold, name in PATREON_AMOUNT_TIERS:
                  if cents >= threshold:
                      return name
              return "default"

          def patron_email(payload):
              # The member's user rides along in `included` as a user resource.
              for inc in (payload.get("included", []) or []):
                  if inc.get("type") == "user":
                      e = (inc.get("attributes", {}) or {}).get("email")
                      if e:
                          return e.strip().lower()
              return ""

          def update_tier_by_email(email, tier):
              if not email:
                  return
              resp = users.query(
                  IndexName="email-index",
                  KeyConditionExpression="email = :e",
                  ExpressionAttributeValues={":e": email},
              )
              for u in resp.get("Items", []):
                  if u.get("tier") == "admin":
                      continue  # never clobber an admin via a pledge event
                  users.update_item(
                      Key={"userId": u["userId"]},
                      UpdateExpression="SET #t = :t",
                      ExpressionAttributeNames={"#t": "tier"},
                      ExpressionAttributeValues={":t": tier},
                  )

          def handler(event, context):
              headers = {k.lower(): v for k, v in (event.get("headers") or {}).items()}
              body = event.get("body") or ""
              if event.get("isBase64Encoded"):
                  body = base64.b64decode(body).decode()
              # Patreon signs the raw body with HMAC-MD5 keyed on the webhook secret.
              expected = hmac.new(get_webhook_secret().encode(), body.encode(), hashlib.md5).hexdigest()
              if not hmac.compare_digest(headers.get("x-patreon-signature", ""), expected):
                  return {"statusCode": 401, "body": "bad signature"}
              evt = headers.get("x-patreon-event", "")
              try:
                  payload = json.loads(body)
              except Exception:
                  return {"statusCode": 400, "body": "bad json"}
              data = payload.get("data", {}) or {}
              tier = tier_from_member(data, evt.endswith(":delete"))
              update_tier_by_email(patron_email(payload), tier)
              print(f"[patreon-webhook] {evt} -> tier={tier}")
              return {"statusCode": 200, "body": "ok"}
  # --- Lambda: Get Subscriber Counts ---
  GetCountsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: allbyte-studio-get-counts
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref SubscriptionsTable
          PRICE_INITIATE: !Ref StripePriceInitiate
