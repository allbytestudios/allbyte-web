          import json
          import os
          import boto3
          from datetime import datetime, timedelta, timezone

          CORS = {
              "Access-Control-Allow-Origin": "*",
              "Access-Control-Allow-Headers": "Content-Type",
              "Access-Control-Allow-Methods": "GET,OPTIONS",
          }

          users_table = boto3.resource("dynamodb").Table(os.environ["USERS_TABLE"])
          subs_table = boto3.resource("dynamodb").Table(os.environ["TABLE_NAME"])

          def handler(event, context):
              if event.get("requestContext", {}).get("http", {}).get("method") == "OPTIONS":
                  return {"statusCode": 200, "headers": CORS}

              now = datetime.now(timezone.utc)
              week_ago = (now - timedelta(days=7)).isoformat()
              month_ago = (now - timedelta(days=30)).isoformat()

              price_to_tier = {
                  os.environ["PRICE_INITIATE"]: "initiate",
                  os.environ["PRICE_HERO"]: "hero",
                  os.environ["PRICE_LEGEND"]: "legend",
              }

              user_resp = users_table.scan(
                  ProjectionExpression="userId, createdAt, tier, oauthProvider",
              )
              all_users = user_resp.get("Items", [])

              total = len(all_users)
              new_this_week = sum(1 for u in all_users if u.get("createdAt", "") >= week_ago)
              new_this_month = sum(1 for u in all_users if u.get("createdAt", "") >= month_ago)

              tier_counts = {}
              oauth_count = 0
              # 365-day rolling window so the dashboard's week/month/year
              # selector can slice client-side without re-fetching. Backend
              # owns the full history; frontend owns the framing.
              DAYS_BACK = 365
              daily_signups = {}
              for i in range(DAYS_BACK):
                  d = (now - timedelta(days=i)).strftime("%Y-%m-%d")
                  daily_signups[d] = 0

              for u in all_users:
                  t = u.get("tier", "free")
                  tier_counts[t] = tier_counts.get(t, 0) + 1
                  if u.get("oauthProvider"):
                      oauth_count += 1
                  created = u.get("createdAt", "")[:10]
                  if created in daily_signups:
                      daily_signups[created] += 1

              daily_series = [
                  {"date": d, "count": daily_signups[d]}
                  for d in sorted(daily_signups.keys())
              ]

              # Cumulative total at the end of each day in the range. Start
              # from "users that existed before the range began" — i.e.,
              # total minus everyone who signed up within the window — then
              # walk forward adding each day's new signups.
              new_in_range = sum(daily_signups.values())
              cumulative = []
              running = total - new_in_range
              for entry in daily_series:
                  running += entry["count"]
                  cumulative.append({"date": entry["date"], "total": running, "new": entry["count"]})

              sub_resp = subs_table.scan(
                  FilterExpression="#s = :active AND attribute_exists(priceId)",
                  ExpressionAttributeNames={"#s": "status"},
                  ExpressionAttributeValues={":active": "active"},
              )
              active_subs = {"initiate": 0, "hero": 0, "legend": 0}
              for item in sub_resp.get("Items", []):
                  tier = price_to_tier.get(item.get("priceId", ""))
                  if tier:
                      active_subs[tier] += 1

              return {
                  "statusCode": 200,
                  "headers": {**CORS, "Cache-Control": "public, max-age=3600"},
                  "body": json.dumps({
                      "totalRegistered": total,
                      "newThisWeek": new_this_week,
                      "newThisMonth": new_this_month,
                      "byTier": tier_counts,
                      "activeSubscriptions": active_subs,
                      "oauthUsers": oauth_count,
                      "emailPasswordUsers": total - oauth_count,
                      "dailyHistory": cumulative,
                  }),
              }

  # --- Lambda: Budget status (admin, queries Cost Explorer) ---
  BudgetStatusFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: allbyte-studio-budget-status
      Runtime: python3.12
      Handler: index.handler
      Timeout: 15
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          BUDGET_LIMIT: !Ref MonthlyBudgetLimit
          SITE_DOMAIN: !Ref SiteDomain
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          from datetime import datetime, timezone

          CORS = {
              "Access-Control-Allow-Origin": os.environ.get("SITE_DOMAIN", "*"),
              "Access-Control-Allow-Headers": "Content-Type,Authorization",
              "Access-Control-Allow-Methods": "GET,OPTIONS",
          }

          ce = boto3.client("ce")

          def handler(event, context):
              if event.get("requestContext", {}).get("http", {}).get("method") == "OPTIONS":
                  return {"statusCode": 200, "headers": CORS}

              now = datetime.now(timezone.utc)
              start = now.strftime("%Y-%m-01")
              end = now.strftime("%Y-%m-%d")

              try:
                  resp = ce.get_cost_and_usage(
                      TimePeriod={"Start": start, "End": end},
                      Granularity="MONTHLY",
                      Metrics=["UnblendedCost"],
                  )

                  results = resp.get("ResultsByTime", [])
                  spent = 0.0
                  if results:
                      spent = float(results[0]["Total"]["UnblendedCost"]["Amount"])

                  budget = float(os.environ.get("BUDGET_LIMIT", "25"))
                  pct = (spent / budget * 100) if budget > 0 else 0

                  day_of_month = now.day
                  import calendar
                  days_in_month = calendar.monthrange(now.year, now.month)[1]
                  days_remaining = days_in_month - day_of_month
                  daily_rate = spent / max(day_of_month, 1)
                  forecast = daily_rate * days_in_month

                  return {
                      "statusCode": 200,
                      "headers": {**CORS, "Cache-Control": "public, max-age=3600"},
                      "body": json.dumps({
                          "spent": round(spent, 2),
                          "budget": budget,
                          "pctUsed": round(pct, 1),
                          "forecast": round(forecast, 2),
                          "dailyRate": round(daily_rate, 2),
                          "daysRemaining": days_remaining,
                          "daysInMonth": days_in_month,
                          "period": start,
                      }),
                  }
              except Exception as e:
                  return {
                      "statusCode": 500,
                      "headers": CORS,
                      "body": json.dumps({"error": str(e)}),
                  }

  # --- Athena resources for SiteTrafficFunction --------------------------
  #
  # The site-traffic chart needs per-request detail (IP, user-agent) to split
  # daily requests into owner / bots / other. CloudWatch's CloudFront metric
  # gives totals only, so we switched the data source to CloudFront access
  # logs (already configured to write to s3://allbyte.studio-access-logs/cf-logs/)
  # and query them via Athena.
  #
  # Glue catalog hosts a single external table over the access-log prefix.
  # Athena workgroup pins the results-output location (cfn-deploy/athena-results/)
  # and enforces a per-query bytes-scanned ceiling so a mis-tuned query can't
  # accidentally blow the budget. Lambda writes a 1-hour TTL cache of the
  # aggregated JSON to s3://allbyte-studio-cfn-deploy/traffic-cache/daily.json
  # so the dashboard's 5-minute polling doesn't fire Athena every refresh.

  TrafficGlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: allbyte_studio_traffic
        Description: CloudFront access logs for AllByte Studios

  TrafficGlueTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref TrafficGlueDatabase
      TableInput:
        Name: cf_access_logs
        Description: CloudFront W3C-extended access logs (gzipped)
        TableType: EXTERNAL_TABLE
        Parameters:
          "skip.header.line.count": "2"
          "EXTERNAL": "TRUE"
        StorageDescriptor:
          # CloudFront standard log format — column list is positional and
          # matches the W3C-extended #Fields header CloudFront writes into
          # every file. Order is fixed; adding fields is backward-compatible
          # because Hive's tab-delimited SerDe just ignores extra columns.
          Columns:
            - { Name: log_date,                 Type: date }
            - { Name: log_time,                 Type: string }
            - { Name: x_edge_location,          Type: string }
            - { Name: sc_bytes,                 Type: bigint }
            - { Name: c_ip,                     Type: string }
            - { Name: cs_method,                Type: string }
            - { Name: cs_host,                  Type: string }
            - { Name: cs_uri_stem,              Type: string }
            - { Name: sc_status,                Type: int }
            - { Name: cs_referer,               Type: string }
            - { Name: cs_user_agent,            Type: string }
            - { Name: cs_uri_query,             Type: string }
            - { Name: cs_cookie,                Type: string }
            - { Name: x_edge_result_type,       Type: string }
            - { Name: x_edge_request_id,        Type: string }
            - { Name: x_host_header,            Type: string }
            - { Name: cs_protocol,              Type: string }
            - { Name: cs_bytes,                 Type: bigint }
            - { Name: time_taken,               Type: float }
            - { Name: x_forwarded_for,          Type: string }
            - { Name: ssl_protocol,             Type: string }
            - { Name: ssl_cipher,               Type: string }
            - { Name: x_edge_response_result_type, Type: string }
            - { Name: cs_protocol_version,      Type: string }
            - { Name: fle_status,               Type: string }
            - { Name: fle_encrypted_fields,     Type: int }
            - { Name: c_port,                   Type: int }
            - { Name: time_to_first_byte,       Type: float }
            - { Name: x_edge_detailed_result_type, Type: string }
            - { Name: sc_content_type,          Type: string }
            - { Name: sc_content_len,           Type: bigint }
            - { Name: sc_range_start,           Type: bigint }
            - { Name: sc_range_end,             Type: bigint }
          Location: s3://allbyte.studio-access-logs/cf-logs/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters:
              "field.delim": "\t"
              "serialization.format": "\t"

  TrafficAthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: allbyte-studio-traffic
      State: ENABLED
      Description: Workgroup for site-traffic classification queries
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: false
        # 5 GB scan ceiling per query — at AllByte's traffic scale a full
        # 365-day scan is well under 100 MB, so this is a generous safety
        # rail rather than a working constraint.
        BytesScannedCutoffPerQuery: 5368709120
        ResultConfiguration:
          OutputLocation: s3://allbyte-studio-cfn-deploy/athena-results/

  # --- Lambda: Site traffic (Athena-backed, public) ---
  #
  # Queries the cf_access_logs Glue table to aggregate yesterday's-and-prior
  # 365 days into per-day counts split by classification:
  #   owner — IP in OWNER_IDENTIFIERS.ips OR User-Agent matching one of
  #           OWNER_IDENTIFIERS.user_agent_patterns (case-insensitive substring)
  #   bots  — User-Agent matches the hard-coded BOT_PATTERNS list
  #   other — everything else
  # CloudFront access logs run ~5–10 minutes behind real-time, so the most
  # recent bucket may under-report; the dashboard's day-grain rendering
  # makes that invisible at ordinary refresh cadence.
  #
  # Results JSON is cached in s3://allbyte-studio-cfn-deploy/traffic-cache/daily.json
  # with a 1-hour TTL. Cache-miss path runs an Athena query (typically 3-8s,
  # well under the function timeout); cache-hit returns immediately.
  SiteTrafficFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: allbyte-studio-site-traffic
      Runtime: python3.12
      Handler: index.handler
      # Athena queries usually finish in 3-8s but can spike to 30s on a
      # cold catalog. We now run TWO queries on a cache miss (traffic split +
      # device breakdown), so 90s gives headroom; cache-hit returns in tens of
      # ms regardless.
      Timeout: 90
      MemorySize: 256
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          GLUE_DATABASE: !Ref TrafficGlueDatabase
          GLUE_TABLE: cf_access_logs
          ATHENA_WORKGROUP: !Ref TrafficAthenaWorkgroup
          CACHE_BUCKET: allbyte-studio-cfn-deploy
          CACHE_KEY: traffic-cache/daily.json
          CACHE_TTL_SECONDS: "3600"
          USERS_TABLE: !Ref UsersTable
          SITE_DOMAIN: !Ref SiteDomain
          # Owner identifiers live in S3 at OWNER_ID_KEY so CFN deploys
          # don't clobber the IP list when the admin "claim IP" endpoint
          # accumulates new IPs over time. The env-var fallback below is
          # only used if the S3 read fails (cold start / S3 outage).
          OWNER_ID_KEY: traffic-config/owner-identifiers.json
          OWNER_IDENTIFIERS: '{"ips":[],"user_agent_patterns":[]}'
      Code:
        ZipFile: |
          import json
          import os
          import time
          import hashlib
          import hmac
          import base64
          import boto3
          from datetime import datetime, timedelta, timezone

          CORS = {
              "Access-Control-Allow-Origin": os.environ.get("SITE_DOMAIN", "*"),
              "Access-Control-Allow-Headers": "Content-Type,Authorization",
              "Access-Control-Allow-Methods": "GET,POST,OPTIONS",
          }

          # Known bot/crawler User-Agent substrings. Matched case-insensitively
          # against cs_user_agent. Covers search engines, social-media link
          # unfurlers, LLM crawlers, and the SEO/scraping bots that show up
          # in logs at AllByte's scale.
          BOT_PATTERNS = [
              "Googlebot", "bingbot", "Slurp", "DuckDuckBot", "Baiduspider",
              "YandexBot", "Sogou", "facebot", "facebookexternalhit",
              "Twitterbot", "LinkedInBot", "Discordbot", "TelegramBot",
              "WhatsApp", "Pinterest", "Mastodon", "applebot",
              "ChatGPT-User", "GPTBot", "OAI-SearchBot", "Anthropic", "Claude",
              "PerplexityBot", "ClaudeBot", "CCBot", "Amazonbot", "Bytespider",
              "MJ12bot", "AhrefsBot", "SemrushBot", "DotBot",
              # Scripts / HTTP tools / headless automation — never a real
              # site visitor. curl swarms + headless renderers hit /play after
              # link posts; none of these strings appear in a real browser UA.
              "curl/", "Wget", "python-requests", "python-httpx", "aiohttp",
              "Go-http-client", "okhttp", "node-fetch", "libwww", "Java/",
              "HeadlessChrome", "Headless", "PhantomJS", "Playwright", "Puppeteer",
          ]

          # Datacenter /16 set for bot detection. Most bots spoof browser UAs
          # but originate from cloud IPs — UA-only classification misses them.
          # The set is the union of AWS + GCP + Azure PUBLISHED IPv4 ranges,
          # collapsed to distinct /16 prefixes ("A.B") by
          # scripts/gen-datacenter-ranges.py and stored at
          # s3://<CACHE_BUCKET>/traffic-config/datacenter-16s.json (~2900 blocks).
          # This replaced the old hand-maintained first-octet list (2026-07-03)
          # after a rotating Azure headless swarm kept leaking into "other" —
          # no more adding /16s one at a time, and it's MORE precise than the
          # old blanket "13."/"20." /8s. Refresh: re-run the generator script.
          # _FALLBACK_DC16 is a tiny safety net used only if the S3 read fails.
          _FALLBACK_DC16 = {
              "13.104", "13.105", "20.106", "40.76", "52.159", "57.151",
              "172.172", "172.182", "172.183", "172.214", "168.62",
              "135.237", "68.220", "4.227", "48.214", "64.236", "45.155",
          }
          # Non-cloud hosting / scraper /16s NOT in the AWS/GCP/Azure published
          # ranges (curated from logs). Merged into every result so switching to
          # the cloud-range set doesn't regress these known scrapers.
          _EXTRA_DC16 = {"45.155", "185.177", "77.83", "64.236", "128.24", "132.196"}
          _DC16_CACHE = {}

          def _load_dc16():
              """Set of datacenter /16 prefixes ('A.B'): the AWS/GCP/Azure union
              from S3 (or a small baked fallback) merged with the non-cloud
              scraper supplement. Cached for the warm-Lambda lifetime."""
              if "s" in _DC16_CACHE:
                  return _DC16_CACHE["s"]
              s16 = None
              try:
                  obj = s3.get_object(
                      Bucket=os.environ["CACHE_BUCKET"],
                      Key="traffic-config/datacenter-16s.json",
                  )
                  loaded = set(json.loads(obj["Body"].read()).get("prefixes16") or [])
                  if len(loaded) >= 1000:
                      s16 = loaded
              except Exception:
                  pass
              base = s16 if s16 is not None else set(_FALLBACK_DC16)
              _DC16_CACHE["s"] = base | _EXTRA_DC16
              return _DC16_CACHE["s"]

          # URL filter for "webapp serves" — HTML page hits, excluding game
          # bootstrap, asset bundles, dev-console polling endpoints, and font
          # files (which are noisy and not pageviews in any useful sense).
          GAME_URL = "/godot/index.html"
          WEBAPP_FILTER_SQL = (
              "((cs_uri_stem = '/' OR cs_uri_stem LIKE '%/' OR cs_uri_stem LIKE '%.html') "
              "AND cs_uri_stem NOT LIKE '/godot/%' "
              "AND cs_uri_stem NOT LIKE '/assets/%' "
              "AND cs_uri_stem NOT LIKE '/_astro/%' "
              "AND cs_uri_stem NOT LIKE '/test-snapshot/%' "
              "AND cs_uri_stem NOT LIKE '/fonts/%')"
          )

          athena = boto3.client("athena")
          s3 = boto3.client("s3")
          users_table = boto3.resource("dynamodb").Table(
              os.environ.get("USERS_TABLE", "allbyte-studio-users")
          )

          DAYS_BACK = 365

          def _empty_daily(now):
              return [
                  {
                      "date": (now - timedelta(days=DAYS_BACK - 1 - i)).strftime("%Y-%m-%d"),
                      "owner": 0,
                      "bots": 0,
                      "other": 0,
                  }
                  for i in range(DAYS_BACK)
              ]

          def _read_cache():
              try:
                  obj = s3.get_object(
                      Bucket=os.environ["CACHE_BUCKET"],
                      Key=os.environ["CACHE_KEY"],
                  )
                  body = json.loads(obj["Body"].read())
                  ts = body.get("_cachedAt", 0)
                  ttl = int(os.environ.get("CACHE_TTL_SECONDS", "3600"))
                  if time.time() - ts < ttl:
                      return body
              except Exception:
                  pass
              return None

          def _write_cache(payload):
              try:
                  s3.put_object(
                      Bucket=os.environ["CACHE_BUCKET"],
                      Key=os.environ["CACHE_KEY"],
                      Body=json.dumps(payload).encode("utf-8"),
                      ContentType="application/json",
                  )
              except Exception:
                  # Cache write failures are non-fatal — the next request
                  # will simply re-query Athena.
                  pass

          def _load_owner_identifiers():
              """Load owner identifiers from S3, with env-var fallback for
              cold-start / S3-outage safety. Returns dict with 'ips' and
              'user_agent_patterns' lists."""
              try:
                  obj = s3.get_object(
                      Bucket=os.environ["CACHE_BUCKET"],
                      Key=os.environ.get("OWNER_ID_KEY", "traffic-config/owner-identifiers.json"),
                  )
                  return json.loads(obj["Body"].read())
              except Exception:
                  pass
              try:
                  return json.loads(os.environ.get("OWNER_IDENTIFIERS", "{}"))
              except Exception:
                  return {"ips": [], "user_agent_patterns": []}

          def _save_owner_identifiers(cfg):
              s3.put_object(
                  Bucket=os.environ["CACHE_BUCKET"],
                  Key=os.environ.get("OWNER_ID_KEY", "traffic-config/owner-identifiers.json"),
                  Body=json.dumps(cfg).encode("utf-8"),
                  ContentType="application/json",
              )

          def _owner_filter_sql():
              """SQL fragment that matches owner traffic. Returns literal
              'false' when no owner identifiers are configured (keeps the
              query valid; all traffic falls into bots/other)."""
              cfg = _load_owner_identifiers()
              clauses = []
              ips = cfg.get("ips") or []
              if ips:
                  quoted = ", ".join(
                      "'" + str(ip).replace("'", "''") + "'" for ip in ips
                  )
                  clauses.append(f"c_ip IN ({quoted})")
              for p in (cfg.get("user_agent_patterns") or []):
                  safe = str(p).replace("'", "''")
                  clauses.append(f"lower(cs_user_agent) LIKE '%{safe.lower()}%'")
              if not clauses:
                  return "false"
              return "(" + " OR ".join(clauses) + ")"

          def _bot_filter_sql():
              """SQL fragment matching bots: known crawler UAs OR an IP whose
              /16 is in the cloud datacenter set (AWS/GCP/Azure). UA-only
              matching misses the headless swarm that spoofs browser UAs from
              cloud IPs — that's most of them in our data."""
              clauses = []
              for p in BOT_PATTERNS:
                  safe = p.replace("'", "''")
                  clauses.append(f"lower(cs_user_agent) LIKE '%{safe.lower()}%'")
              dc16 = _load_dc16()
              if dc16:
                  quoted = ",".join("'" + p + "'" for p in sorted(dc16))
                  clauses.append(
                      "(split_part(c_ip,'.',1) || '.' || split_part(c_ip,'.',2)) IN ("
                      + quoted + ")"
                  )
              return "(" + " OR ".join(clauses) + ")"

          def _bust_cache():
              try:
                  s3.delete_object(
                      Bucket=os.environ["CACHE_BUCKET"],
                      Key=os.environ["CACHE_KEY"],
                  )
              except Exception:
                  pass

          # JWT verification — same pattern as AdminListUsersFunction.
          _jwt_cache = {}
          def _get_jwt_secret():
              if "jwt" not in _jwt_cache:
                  sm = boto3.client("secretsmanager")
                  _jwt_cache["jwt"] = sm.get_secret_value(
                      SecretId="allbyte-studio/jwt-secret"
                  )["SecretString"]
              return _jwt_cache["jwt"]

          def _verify_jwt(token, secret):
              parts = token.split(".")
              if len(parts) != 3:
                  return None
              sig_input = f"{parts[0]}.{parts[1]}"
              expected_sig = base64.urlsafe_b64encode(
                  hmac.new(secret.encode(), sig_input.encode(), hashlib.sha256).digest()
              ).rstrip(b"=").decode()
              if not hmac.compare_digest(parts[2], expected_sig):
                  return None
              payload_b64 = parts[1] + "=" * (4 - len(parts[1]) % 4)
              payload = json.loads(base64.urlsafe_b64decode(payload_b64))
              if payload.get("exp", 0) < time.time():
                  return None
              return payload

          def _err(code, msg):
              return {"statusCode": code, "headers": CORS, "body": json.dumps({"error": msg})}

          def _run_athena_query(now):
              owner_expr = _owner_filter_sql()
              bot_expr = _bot_filter_sql()
              start_date = (now - timedelta(days=DAYS_BACK)).strftime("%Y-%m-%d")
              database = os.environ["GLUE_DATABASE"]
              table = os.environ["GLUE_TABLE"]
              # Single query returns both game and webapp aggregates per day.
              # Classification is mutually exclusive: owner > bots > other,
              # encoded in the CASE expression ordering.
              # is_owner / is_bot computed ONCE per row in the inner select so
              # the (large) datacenter-/16 IN list is only materialized once,
              # not repeated per CASE column. Classification is mutually
              # exclusive: owner > bots > other.
              query = f"""
                  SELECT
                      d,
                      SUM(CASE WHEN is_game AND is_owner THEN 1 ELSE 0 END) AS game_owner,
                      SUM(CASE WHEN is_game AND NOT is_owner AND is_bot THEN 1 ELSE 0 END) AS game_bots,
                      SUM(CASE WHEN is_game AND NOT is_owner AND NOT is_bot THEN 1 ELSE 0 END) AS game_other,
                      SUM(CASE WHEN is_webapp AND is_owner THEN 1 ELSE 0 END) AS webapp_owner,
                      SUM(CASE WHEN is_webapp AND NOT is_owner AND is_bot THEN 1 ELSE 0 END) AS webapp_bots,
                      SUM(CASE WHEN is_webapp AND NOT is_owner AND NOT is_bot THEN 1 ELSE 0 END) AS webapp_other
                  FROM (
                      SELECT
                          date_format(log_date, '%Y-%m-%d') AS d,
                          (cs_uri_stem = '{GAME_URL}') AS is_game,
                          ({WEBAPP_FILTER_SQL}) AS is_webapp,
                          ({owner_expr}) AS is_owner,
                          ({bot_expr}) AS is_bot
                      FROM {table}
                      WHERE log_date >= DATE '{start_date}'
                  )
                  GROUP BY d
                  ORDER BY d
              """
              start = athena.start_query_execution(
                  QueryString=query,
                  QueryExecutionContext={"Database": database},
                  WorkGroup=os.environ["ATHENA_WORKGROUP"],
              )
              qid = start["QueryExecutionId"]
              # Poll for completion. Athena typical for this table size is
              # 3-8s; cap at ~50s so we leave headroom before the function
              # times out.
              deadline = time.time() + 50
              delay = 0.5
              while time.time() < deadline:
                  st = athena.get_query_execution(QueryExecutionId=qid)
                  state = st["QueryExecution"]["Status"]["State"]
                  if state == "SUCCEEDED":
                      break
                  if state in ("FAILED", "CANCELLED"):
                      reason = st["QueryExecution"]["Status"].get("StateChangeReason", "unknown")
                      raise RuntimeError(f"Athena {state}: {reason}")
                  time.sleep(delay)
                  delay = min(delay * 1.5, 4.0)
              else:
                  raise TimeoutError("Athena query did not complete in time")

              by_date = {}
              token = None
              while True:
                  kwargs = {"QueryExecutionId": qid, "MaxResults": 1000}
                  if token:
                      kwargs["NextToken"] = token
                  res = athena.get_query_results(**kwargs)
                  rows = res["ResultSet"]["Rows"]
                  for row in rows:
                      data = row.get("Data", [])
                      vals = [d.get("VarCharValue", "") for d in data]
                      if not vals or vals[0] == "d":  # header row
                          continue
                      try:
                          d = vals[0]
                          go = int(vals[1] or 0); gb = int(vals[2] or 0); gx = int(vals[3] or 0)
                          wo = int(vals[4] or 0); wb = int(vals[5] or 0); wx = int(vals[6] or 0)
                      except (ValueError, IndexError):
                          continue
                      by_date[d] = (go, gb, gx, wo, wb, wx)
                  token = res.get("NextToken")
                  if not token:
                      break
              return by_date

          def _run_device_query(now):
              """Coarse OS+browser of real (non-owner, non-bot) visitors to the
              entry pages. Distinct IPs ~ unique visitors. Best-effort — a
              failure here must not break the main traffic split."""
              owner_expr = _owner_filter_sql()
              bot_expr = _bot_filter_sql()
              start_date = (now - timedelta(days=DAYS_BACK)).strftime("%Y-%m-%d")
              database = os.environ["GLUE_DATABASE"]
              table = os.environ["GLUE_TABLE"]
              os_case = (
                  "CASE WHEN lower(cs_user_agent) LIKE '%iphone%' OR lower(cs_user_agent) LIKE '%ipad%' "
                  "OR lower(cs_user_agent) LIKE '%ipod%' THEN 'iOS' "
                  "WHEN lower(cs_user_agent) LIKE '%android%' THEN 'Android' "
                  "WHEN lower(cs_user_agent) LIKE '%windows%' THEN 'Windows' "
                  "WHEN lower(cs_user_agent) LIKE '%mac os%' OR lower(cs_user_agent) LIKE '%macintosh%' THEN 'macOS' "
                  "WHEN lower(cs_user_agent) LIKE '%linux%' THEN 'Linux' ELSE 'Other' END"
              )
              br_case = (
                  "CASE WHEN lower(cs_user_agent) LIKE '%edg%' THEN 'Edge' "
                  "WHEN lower(cs_user_agent) LIKE '%firefox%' THEN 'Firefox' "
                  "WHEN lower(cs_user_agent) LIKE '%chrome%' OR lower(cs_user_agent) LIKE '%crios%' THEN 'Chrome' "
                  "WHEN lower(cs_user_agent) LIKE '%safari%' THEN 'Safari' ELSE 'Other' END"
              )
              dev_expr = f"{os_case} || ' ' || {br_case}"
              query = f"""
                  SELECT {dev_expr} AS dev, COUNT(DISTINCT c_ip) AS uniq
                  FROM {table}
                  WHERE log_date >= DATE '{start_date}' AND sc_status = 200
                    AND ({WEBAPP_FILTER_SQL} OR cs_uri_stem = '{GAME_URL}')
                    AND NOT ({owner_expr}) AND NOT ({bot_expr})
                  GROUP BY {dev_expr}
                  ORDER BY uniq DESC
              """
              start = athena.start_query_execution(
                  QueryString=query,
                  QueryExecutionContext={"Database": database},
                  WorkGroup=os.environ["ATHENA_WORKGROUP"],
              )
              qid = start["QueryExecutionId"]
              deadline = time.time() + 30
              delay = 0.5
              while time.time() < deadline:
                  st = athena.get_query_execution(QueryExecutionId=qid)
                  state = st["QueryExecution"]["Status"]["State"]
                  if state == "SUCCEEDED":
                      break
                  if state in ("FAILED", "CANCELLED"):
                      raise RuntimeError("device query " + state)
                  time.sleep(delay)
                  delay = min(delay * 1.5, 4.0)
              else:
                  raise TimeoutError("device query timed out")
              devices = {}
              token = None
              while True:
                  kwargs = {"QueryExecutionId": qid, "MaxResults": 1000}
                  if token:
                      kwargs["NextToken"] = token
                  res = athena.get_query_results(**kwargs)
                  for row in res["ResultSet"]["Rows"]:
                      vals = [d.get("VarCharValue", "") for d in row.get("Data", [])]
                      if not vals or vals[0] == "dev":
                          continue
                      try:
                          devices[vals[0]] = int(vals[1] or 0)
                      except (ValueError, IndexError):
                          continue
                  token = res.get("NextToken")
                  if not token:
                      break
              return devices

          def _get_analytics(now):
              cached = _read_cache()
              if cached:
                  return {
                      "statusCode": 200,
                      "headers": {**CORS, "Cache-Control": "public, max-age=300"},
                      "body": json.dumps({
                          k: v for k, v in cached.items() if not k.startswith("_")
                      }),
                  }

              try:
                  by_date = _run_athena_query(now)
              except Exception as e:
                  # Graceful degradation: return zero-filled history rather
                  # than 500. Dashboard renders empty chart instead of breaking.
                  return {
                      "statusCode": 200,
                      "headers": CORS,
                      "body": json.dumps({
                          "totalRequests7d": 0,
                          "dailyGameServes": _empty_daily(now),
                          "dailyWebappServes": _empty_daily(now),
                          "error": str(e)[:200],
                      }),
                  }

              game_daily, webapp_daily = [], []
              for i in range(DAYS_BACK):
                  d = (now - timedelta(days=DAYS_BACK - 1 - i)).strftime("%Y-%m-%d")
                  go, gb, gx, wo, wb, wx = by_date.get(d, (0, 0, 0, 0, 0, 0))
                  game_daily.append({"date": d, "owner": go, "bots": gb, "other": gx})
                  webapp_daily.append({"date": d, "owner": wo, "bots": wb, "other": wx})

              total_7d = sum(
                  e["owner"] + e["bots"] + e["other"]
                  for e in game_daily[-7:] + webapp_daily[-7:]
              )
              try:
                  devices = _run_device_query(now)
              except Exception:
                  devices = {}  # best-effort; never fail the main split
              payload = {
                  "totalRequests7d": total_7d,
                  "dailyGameServes": game_daily,
                  "dailyWebappServes": webapp_daily,
                  "devices": devices,
                  "_cachedAt": int(time.time()),
              }
              _write_cache(payload)
              return {
                  "statusCode": 200,
                  "headers": {**CORS, "Cache-Control": "public, max-age=300"},
                  "body": json.dumps({
                      k: v for k, v in payload.items() if not k.startswith("_")
                  }),
              }

          def _post_claim_owner_ip(event):
              """POST /analytics/traffic/owner-ip — admin only.

              Adds caller's source IP to OWNER_IDENTIFIERS.ips (deduped),
              persists to S3, and busts the analytics cache so the next
              dashboard fetch reflects the new classifier."""
              auth = event.get("headers", {}).get("authorization", "")
              if not auth.startswith("Bearer "):
                  return _err(401, "No token provided")
              token = auth[7:]
              payload = _verify_jwt(token, _get_jwt_secret())
              if not payload:
                  return _err(401, "Invalid or expired token")
              actor_resp = users_table.get_item(Key={"userId": payload["sub"]})
              actor = actor_resp.get("Item")
              if not actor or actor.get("tier") != "admin":
                  return _err(403, "Admin tier required")

              source_ip = event.get("requestContext", {}).get("http", {}).get("sourceIp")
              if not source_ip:
                  return _err(400, "Could not determine source IP")

              cfg = _load_owner_identifiers()
              ips = list(cfg.get("ips") or [])
              added = source_ip not in ips
              if added:
                  ips.append(source_ip)
                  cfg["ips"] = ips
                  _save_owner_identifiers(cfg)
                  _bust_cache()

              return {
                  "statusCode": 200,
                  "headers": CORS,
                  "body": json.dumps({
                      "ip": source_ip,
                      "added": added,
                      "ips": ips,
                      "user_agent_patterns": cfg.get("user_agent_patterns") or [],
                  }),
              }

          def handler(event, context):
              method = event.get("requestContext", {}).get("http", {}).get("method")
              if method == "OPTIONS":
                  return {"statusCode": 200, "headers": CORS}
              if method == "POST":
                  path = event.get("rawPath") or event.get("requestContext", {}).get("http", {}).get("path", "")
                  if path.endswith("/owner-ip"):
                      return _post_claim_owner_ip(event)
                  return _err(404, "unknown POST path")
              return _get_analytics(datetime.now(timezone.utc))

  # --- Lambda: Admin — list all users (admin tier only) ---
  AdminListUsersFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: allbyte-studio-admin-list-users
      Runtime: python3.12
      Handler: index.handler
      Timeout: 15
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          SITE_DOMAIN: !Ref SiteDomain
      Code:
        ZipFile: |
          import json
          import os
          import hashlib
          import hmac
          import base64
          import time
          import boto3

          users = boto3.resource("dynamodb").Table(os.environ["USERS_TABLE"])

          CORS = {
              "Access-Control-Allow-Origin": os.environ["SITE_DOMAIN"],
              "Access-Control-Allow-Headers": "Content-Type,Authorization",
              "Access-Control-Allow-Methods": "GET,OPTIONS",
          }

          _cache = {}
          def get_jwt_secret():
              if "jwt" not in _cache:
                  sm = boto3.client("secretsmanager")
                  _cache["jwt"] = sm.get_secret_value(SecretId="allbyte-studio/jwt-secret")["SecretString"]
              return _cache["jwt"]

          def verify_jwt(token, secret):
              parts = token.split(".")
              if len(parts) != 3:
                  return None
              sig_input = f"{parts[0]}.{parts[1]}"
              expected_sig = base64.urlsafe_b64encode(
                  hmac.new(secret.encode(), sig_input.encode(), hashlib.sha256).digest()
              ).rstrip(b"=").decode()
              if not hmac.compare_digest(parts[2], expected_sig):
                  return None
              payload_b64 = parts[1] + "=" * (4 - len(parts[1]) % 4)
              payload = json.loads(base64.urlsafe_b64decode(payload_b64))
              if payload.get("exp", 0) < time.time():
                  return None
              return payload

          def err(code, msg):
              return {"statusCode": code, "headers": CORS, "body": json.dumps({"error": msg})}

          # Sensitive fields stripped from the API response so the admin UI never
          # sees password hashes / oauth IDs.
          STRIP_FIELDS = {"passwordHash", "oauthId"}

          def handler(event, context):
              if event.get("requestContext", {}).get("http", {}).get("method") == "OPTIONS":
                  return {"statusCode": 200, "headers": CORS}

              auth = event.get("headers", {}).get("authorization", "")
              if not auth.startswith("Bearer "):
                  return err(401, "No token provided")

              token = auth[7:]
              jwt_secret = get_jwt_secret()
              payload = verify_jwt(token, jwt_secret)
              if not payload:
                  return err(401, "Invalid or expired token")

              # Verify the calling user is an admin.
              actor_resp = users.get_item(Key={"userId": payload["sub"]})
              actor = actor_resp.get("Item")
              if not actor or actor.get("tier") != "admin":
                  return err(403, "Admin tier required")

              # Scan all users (small table — fine for now). Strip sensitive fields.
              try:
                  scan = users.scan()
                  items = scan.get("Items", [])
              except Exception as e:
                  return err(500, f"scan failed: {e}")

              cleaned = []
              for u in items:
                  out = {k: v for k, v in u.items() if k not in STRIP_FIELDS}
                  # Coerce DynamoDB Decimals etc to JSON-friendly types if needed
                  for k, v in list(out.items()):
                      if hasattr(v, "__int__") and not isinstance(v, (int, str, bool)):
                          out[k] = int(v)
                  cleaned.append(out)

              # Sort newest first (createdAt is ISO-8601, lexicographic sort works).
              cleaned.sort(key=lambda x: x.get("createdAt", ""), reverse=True)

              return {
                  "statusCode": 200,
                  "headers": CORS,
                  "body": json.dumps({"users": cleaned, "count": len(cleaned)}),
              }

  # --- Lambda: Admin — set a user's tier (admin tier only) ---
  AdminSetTierFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: allbyte-studio-admin-set-tier
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          SITE_DOMAIN: !Ref SiteDomain
      Code:
        ZipFile: |
          import json
          import os
          import hashlib
          import hmac
          import base64
          import time
          import boto3

          users = boto3.resource("dynamodb").Table(os.environ["USERS_TABLE"])
          VALID_TIERS = {"default", "initiate", "hero", "legend", "admin"}

          CORS = {
              "Access-Control-Allow-Origin": os.environ["SITE_DOMAIN"],
              "Access-Control-Allow-Headers": "Content-Type,Authorization",
              "Access-Control-Allow-Methods": "PUT,OPTIONS",
          }

          _cache = {}
          def get_jwt_secret():
              if "jwt" not in _cache:
                  sm = boto3.client("secretsmanager")
                  _cache["jwt"] = sm.get_secret_value(SecretId="allbyte-studio/jwt-secret")["SecretString"]
              return _cache["jwt"]

          def verify_jwt(token, secret):
              parts = token.split(".")
              if len(parts) != 3:
                  return None
              sig_input = f"{parts[0]}.{parts[1]}"
              expected_sig = base64.urlsafe_b64encode(
                  hmac.new(secret.encode(), sig_input.encode(), hashlib.sha256).digest()
              ).rstrip(b"=").decode()
              if not hmac.compare_digest(parts[2], expected_sig):
                  return None
              payload_b64 = parts[1] + "=" * (4 - len(parts[1]) % 4)
              payload = json.loads(base64.urlsafe_b64decode(payload_b64))
              if payload.get("exp", 0) < time.time():
                  return None
              return payload

          def err(code, msg):
              return {"statusCode": code, "headers": CORS, "body": json.dumps({"error": msg})}

          def handler(event, context):
              if event.get("requestContext", {}).get("http", {}).get("method") == "OPTIONS":
                  return {"statusCode": 200, "headers": CORS}

              auth = event.get("headers", {}).get("authorization", "")
              if not auth.startswith("Bearer "):
                  return err(401, "No token provided")

              token = auth[7:]
              jwt_secret = get_jwt_secret()
              payload = verify_jwt(token, jwt_secret)
              if not payload:
                  return err(401, "Invalid or expired token")

              # Admin assertion
              actor_id = payload["sub"]
              actor_resp = users.get_item(Key={"userId": actor_id})
              actor = actor_resp.get("Item")
              if not actor or actor.get("tier") != "admin":
                  return err(403, "Admin tier required")

              # Path param: userId
              path_params = event.get("pathParameters") or {}
              target_id = path_params.get("userId", "")
              if not target_id:
                  return err(400, "Missing userId path param")

              # Body: tier
              try:
                  body = json.loads(event.get("body", "{}") or "{}")
              except Exception:
                  return err(400, "Invalid JSON body")
              new_tier = body.get("tier", "")
              if new_tier not in VALID_TIERS:
                  return err(400, f"Invalid tier '{new_tier}'. Must be one of {sorted(VALID_TIERS)}")

              # Block self-demotion to prevent admin lockout. Admins can't change
              # their own tier — another admin must do it (or the InitialAdminEmail
              # bootstrap re-promotes on next /auth/me call).
              if target_id == actor_id and new_tier != "admin":
                  return err(409, "Admins cannot demote themselves. Have another admin do it.")

              # Verify target exists
              target_resp = users.get_item(Key={"userId": target_id})
              target = target_resp.get("Item")
              if not target:
                  return err(404, "Target user not found")

              old_tier = target.get("tier", "default")

              try:
                  users.update_item(
                      Key={"userId": target_id},
                      UpdateExpression="SET #t = :t",
                      ExpressionAttributeNames={"#t": "tier"},
                      ExpressionAttributeValues={":t": new_tier},
                  )
              except Exception as e:
                  return err(500, f"update failed: {e}")

              # CloudWatch audit line — picked up by Lambda's stdout log group.
              print(
                  f"[AUDIT] admin={actor_id} ({actor.get('email','')}) "
                  f"set userId={target_id} ({target.get('email','')}) "
                  f"tier={old_tier}->{new_tier}"
              )

              return {
                  "statusCode": 200,
                  "headers": CORS,
                  "body": json.dumps({
                      "userId": target_id,
                      "tier": new_tier,
                      "previousTier": old_tier,
                  }),
              }

  # --- Lambda: PCK signed-URL issuer ---
  # GET /pck-url?pack=<name>
  # For `public` packs (in PACK_TIER_REQUIREMENTS): no auth required, anyone
  # gets a 15-min signed URL. For tiered packs: JWT required, tier checked.
  GetPckUrlFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: allbyte-studio-pck-url
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          PACKS_BUCKET: !Ref PacksBucket
          SITE_DOMAIN: !Ref SiteDomain
          URL_TTL_SECONDS: "900"
      Code:
        ZipFile: |
          import json
          import os
          import hashlib
          import hmac
          import base64
          import time
          import re
          import boto3
          from botocore.config import Config

          # us-east-1 signature-v4 client, required for presigned URL generation
          s3 = boto3.client("s3", config=Config(signature_version="s3v4"))
          BUCKET = os.environ["PACKS_BUCKET"]
          TTL = int(os.environ.get("URL_TTL_SECONDS", "900"))
          SITE_DOMAIN = os.environ["SITE_DOMAIN"]

          # Tier ordering — index into list = user's entitlement rank.
          # Pack requires tier >= its declared requirement.
          TIER_ORDER = ["default", "initiate", "hero", "legend", "admin"]
          TIER_RANK = {t: i for i, t in enumerate(TIER_ORDER)}

          # Per-pack tier requirements. "public" means no auth needed at all.
          # Add new packs here as they ship; omitting a pack = 404.
          PACK_TIER_REQUIREMENTS = {
              "Core":         "public",
              "LariaVillage": "public",
              # Future zones gated as they ship:
              # "Waterways":  "hero",
              # "DwarvenRuin":"legend",
          }

          PACK_NAME_RE = re.compile(r"^[A-Za-z0-9_-]{1,64}$")

          CORS_ORIGINS = {SITE_DOMAIN, "http://localhost:4321", "http://localhost:4322"}

          def build_cors(event):
              origin = (event.get("headers") or {}).get("origin", SITE_DOMAIN)
              allow = origin if origin in CORS_ORIGINS else SITE_DOMAIN
              return {
                  "Access-Control-Allow-Origin": allow,
                  "Access-Control-Allow-Headers": "Content-Type,Authorization",
                  "Access-Control-Allow-Methods": "GET,OPTIONS",
                  "Cache-Control": "no-store",
              }

          _secret_cache = {}
          def get_jwt_secret():
              if "jwt" not in _secret_cache:
                  sm = boto3.client("secretsmanager")
                  _secret_cache["jwt"] = sm.get_secret_value(
                      SecretId="allbyte-studio/jwt-secret"
                  )["SecretString"]
              return _secret_cache["jwt"]

          def verify_jwt(token, secret):
              try:
                  parts = token.split(".")
                  if len(parts) != 3:
                      return None
                  sig_input = f"{parts[0]}.{parts[1]}"
                  expected_sig = base64.urlsafe_b64encode(
                      hmac.new(secret.encode(), sig_input.encode(), hashlib.sha256).digest()
                  ).rstrip(b"=").decode()
                  if not hmac.compare_digest(parts[2], expected_sig):
                      return None
                  payload_b64 = parts[1] + "=" * (4 - len(parts[1]) % 4)
                  payload = json.loads(base64.urlsafe_b64decode(payload_b64))
                  if payload.get("exp", 0) < time.time():
                      return None
                  return payload
              except Exception:
                  return None

          def handler(event, context):
              cors = build_cors(event)
              qs = event.get("queryStringParameters") or {}
              pack = qs.get("pack", "")

              if not PACK_NAME_RE.match(pack):
                  return {"statusCode": 400, "headers": cors,
                          "body": json.dumps({"error": "invalid pack name"})}

              required_tier = PACK_TIER_REQUIREMENTS.get(pack)
              if required_tier is None:
                  return {"statusCode": 404, "headers": cors,
                          "body": json.dumps({"error": "unknown pack"})}

              user_id = None
              user_tier = "default"

              # Auth path: required for non-public packs, optional for public ones.
              if required_tier != "public":
                  auth_header = (event.get("headers") or {}).get("authorization", "")
                  if not auth_header.lower().startswith("bearer "):
                      return {"statusCode": 401, "headers": cors,
                              "body": json.dumps({"error": "auth required"})}
                  token = auth_header.split(" ", 1)[1].strip()
                  payload = verify_jwt(token, get_jwt_secret())
                  if not payload:
                      return {"statusCode": 401, "headers": cors,
                              "body": json.dumps({"error": "invalid or expired token"})}
                  user_id = payload.get("sub")
                  user_tier = payload.get("tier", "default")
                  if TIER_RANK.get(user_tier, 0) < TIER_RANK.get(required_tier, 0):
                      print(f"AUDIT: user={user_id} tier={user_tier} denied {pack} (needs {required_tier})")
                      return {"statusCode": 403, "headers": cors,
                              "body": json.dumps({"error": "tier insufficient"})}

              # Mint the signed URL
              try:
                  signed_url = s3.generate_presigned_url(
                      "get_object",
                      Params={"Bucket": BUCKET, "Key": f"packs/{pack}.pck"},
                      ExpiresIn=TTL,
                  )
              except Exception as e:
                  print(f"ERROR: presign failed for {pack}: {e}")
                  return {"statusCode": 500, "headers": cors,
                          "body": json.dumps({"error": "internal error"})}

              # Audit log: who requested what (user_id may be None for public packs)
              print(f"AUDIT: user={user_id or 'anonymous'} tier={user_tier} granted {pack}")

              return {
                  "statusCode": 200,
                  "headers": {**cors, "Content-Type": "application/json"},
                  "body": json.dumps({"url": signed_url, "ttl": TTL}),
              }

  # --- API Gateway ---
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: allbyte-studio-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref SiteDomain
          - "http://localhost:4321"
        AllowMethods:
          - POST
          - GET
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  # --- Custom domain for the HTTP API ---
  # Why this exists: the OAuth start Lambda builds redirect_uri from the request's
  # domainName, and Google's consent screen shows that domain to the user as
  # "to continue to ...". Without a custom domain, users see the raw API Gateway
  # hostname (wj3xkrm1r1.execute-api...). Routing through api.allbyte.studio
  # makes the consent screen read clearly as AllByte.
  ApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref ApiCustomDomain
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref ApiCustomDomain
          HostedZoneId: !Ref HostedZoneId

  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !Ref ApiCustomDomain
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertificate
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  ApiDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomainName
      Stage: !Ref ApiStage

  ApiDomainRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiCustomDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiDomainName.RegionalDomainName
        HostedZoneId: !GetAtt ApiDomainName.RegionalHostedZoneId
  MeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt MeFunction.Arn
      PayloadFormatVersion: "2.0"

  MeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /auth/me"
      Target: !Sub "integrations/${MeIntegration}"

  MePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MeFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*"

  # OAuth routes
  OAuthStartIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt OAuthStartFunction.Arn
      PayloadFormatVersion: "2.0"

  OAuthStartRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
