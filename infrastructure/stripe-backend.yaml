      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*"

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UsersTableName:
    Value: !Ref UsersTable
  SubscriptionsTableName:
    Value: !Ref SubscriptionsTable
  WebhookUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/webhook"
  PckUrlEndpoint:
    Description: "Endpoint for PackLoader auth flow. GET with ?pack=<name>. Public packs need no auth; tiered packs need Bearer JWT."
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/pck-url"
  PacksBucketName:
    Description: "S3 bucket where .pck files live (private; access only via signed URLs)"
    Value: !Ref PacksBucket
  ApiCustomDomainUrl:
    Description: "Custom domain URL for the API. Use this in src/lib/auth.svelte.ts and as the OAuth redirect URI base."
    Value: !Sub "https://${ApiCustomDomain}"
